<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务仓库排序 Demo</title>
    <style>
      :root {
        color: #26342d;
        background: #f5f7f5;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 42px clamp(20px, 6vw, 78px);
        background:
          radial-gradient(circle at 88% 0%, rgba(51, 111, 83, 0.08), transparent 28%),
          #f5f7f5;
      }

      main { max-width: 950px; }

      .eyebrow {
        margin: 0 0 10px;
        color: #75817a;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 0;
        color: #17251f;
        font-size: clamp(26px, 3vw, 36px);
        font-weight: 720;
        letter-spacing: -0.055em;
      }

      .repository {
        margin-top: 22px;
      }

      .repository-head {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 82px 34px;
        align-items: center;
        min-height: 28px;
        color: #718078;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.06em;
      }

      .repository-head span:nth-child(3),
      .repository-head span:nth-child(4) { text-align: right; }

      .task-list { margin: 0; padding: 0; list-style: none; }

      .task-row {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 82px 34px;
        align-items: center;
        min-height: 48px;
        background: transparent;
        cursor: grab;
        transition: background-color 160ms ease, opacity 160ms ease, transform 160ms ease;
      }

      .task-row:hover { background: rgba(223, 235, 227, 0.48); }
      .task-row:active { cursor: grabbing; }
      .task-row.dragging { opacity: 0.38; }
      .task-row.drop-target { background: rgba(91, 143, 113, 0.11); }

      .sequence {
        align-self: start;
        padding-top: 11px;
        color: #7e8b83;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .task-copy { min-width: 0; padding: 3px 18px 3px 0; }

      .task-title {
        display: block;
        overflow: hidden;
        color: #25332c;
        font-size: 15px;
        font-weight: 650;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-next {
        display: block;
        overflow: hidden;
        margin-top: 1px;
        color: #929d96;
        font-size: 10.5px;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .priority {
        display: inline-flex;
        align-items: center;
        justify-self: end;
        gap: 7px;
        color: #90733a;
        font-size: 12px;
        font-weight: 650;
      }

      .priority::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .priority.high { color: #a96458; }
      .priority.low { color: #80958a; }

      .complete {
        position: relative;
        justify-self: end;
        width: 16px;
        height: 16px;
        border: 1px solid #bccbc2;
        border-radius: 5px;
        padding: 0;
        background: transparent;
        color: #ffffff;
        cursor: pointer;
      }

      .complete:hover { border-color: #66957d; background: rgba(102, 149, 125, 0.08); }
      .complete.is-complete { border-color: #4e8067; background: #4e8067; }
      .complete.is-complete::after {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 7px;
        height: 4px;
        border-bottom: 1.5px solid currentColor;
        border-left: 1.5px solid currentColor;
        content: "";
        transform: rotate(-45deg);
      }

      .task-row.completed .task-title { color: #849087; text-decoration: line-through; text-decoration-thickness: 1px; }
      .task-row.completed .task-next, .task-row.completed .priority { opacity: 0.56; }

      @media (max-width: 600px) {
        body { padding: 28px 20px; }
        .repository-head, .task-row { grid-template-columns: 34px minmax(0, 1fr) 64px 30px; }
        .repository-head { font-size: 11px; }
        .task-title { font-size: 14px; }
        .priority { font-size: 11px; gap: 5px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">工作台 / 待实现功能</p>
      <h1>任务仓库</h1>

      <section class="repository" aria-label="任务仓库排序示例">
        <header class="repository-head" aria-hidden="true">
          <span>序号</span><span>任务</span><span>优先级</span><span>完成</span>
        </header>
        <ol class="task-list" id="task-list">
          <li class="task-row" draggable="true">
            <span class="sequence"></span>
            <span class="task-copy"><span class="task-title">左上右上角置顶显示今日任务</span><span class="task-next">下一步：补充任务背景或新增第一个节点</span></span>
            <span class="priority">中</span>
            <button class="complete" type="button" aria-label="标记为完成"></button>
          </li>
          <li class="task-row" draggable="true">
            <span class="sequence"></span>
            <span class="task-copy"><span class="task-title">修改整体的界面简约简单</span><span class="task-next">下一步：整理任务仓库的展示结构</span></span>
            <span class="priority high">高</span>
            <button class="complete" type="button" aria-label="标记为完成"></button>
          </li>
          <li class="task-row completed" draggable="true">
            <span class="sequence"></span>
            <span class="task-copy"><span class="task-title">补充任务背景</span><span class="task-next">已完成</span></span>
            <span class="priority low">低</span>
            <button class="complete is-complete" type="button" aria-label="标记为未完成" aria-pressed="true"></button>
          </li>
        </ol>
      </section>
    </main>

    <script>
      const list = document.querySelector("#task-list");
      let draggedRow = null;

      function updateSequence() {
        [...list.children].forEach((row, index) => {
          row.querySelector(".sequence").textContent = String(index + 1).padStart(2, "0");
        });
      }

      list.addEventListener("dragstart", (event) => {
        const row = event.target.closest(".task-row");
        if (!row || event.target.closest("button")) return event.preventDefault();
        draggedRow = row;
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
      });

      list.addEventListener("dragover", (event) => {
        event.preventDefault();
        const target = event.target.closest(".task-row");
        if (!draggedRow || !target || target === draggedRow) return;
        document.querySelectorAll(".drop-target").forEach((row) => row.classList.remove("drop-target"));
        target.classList.add("drop-target");
        const { top, height } = target.getBoundingClientRect();
        list.insertBefore(draggedRow, event.clientY < top + height / 2 ? target : target.nextSibling);
      });

      list.addEventListener("dragend", () => {
        document.querySelectorAll(".task-row").forEach((row) => row.classList.remove("dragging", "drop-target"));
        draggedRow = null;
        updateSequence();
      });

      list.addEventListener("click", (event) => {
        const button = event.target.closest(".complete");
        if (!button) return;
        const row = button.closest(".task-row");
        const completed = row.classList.toggle("completed");
        button.classList.toggle("is-complete", completed);
        button.setAttribute("aria-label", completed ? "标记为未完成" : "标记为完成");
        button.setAttribute("aria-pressed", String(completed));
      });

      updateSequence();
    </script>
  </body>
</html>
