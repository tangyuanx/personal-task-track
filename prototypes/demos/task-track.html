<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Track</title>
  <style>
:root{
  --page:#f3f4f2;--sidebar:#eef0ee;--surface:#fcfdfc;--white:#fff;
  --ink:#26312b;--text-secondary:#59635d;--muted:#747c77;--soft:#9aa09c;
  --focus-950:#17392d;--focus-900:#214a3a;--focus-800:#2e5d49;--focus-700:#3d6d57;
  --focus-300:#a9c2b2;--focus-100:#e5eee8;--focus-50:#f1f6f2;
  --line:#e1e5e2;--line-strong:#d2d8d4;--line-soft:#edf0ee;
  --done:#66776c;--doing:#806f4b;--waiting:#6a7981;--todo:#8b928e;--danger:#a14e48;
  --flow-col-process:42fr;--flow-col-record:32fr;--flow-col-status:12fr;--flow-col-time:14fr;
}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}input,textarea,select{outline:none}
.app{width:100%;height:100vh;display:grid;grid-template-columns:clamp(370px,25vw,410px) minmax(0,1fr);background:var(--surface)}

/* 左侧 */
.sidebar{min-width:0;height:100vh;display:flex;flex-direction:column;gap:12px;padding:20px 18px 14px;overflow:hidden;border-right:1px solid var(--line-strong);background:linear-gradient(180deg,#f2f4f2 0%,var(--sidebar) 100%)}
.brand-row{display:flex;justify-content:space-between;gap:14px;padding:0 3px}.brand-title{margin:0;color:#2c3630;font-size:22px;font-weight:780;letter-spacing:-.6px}.brand-subtitle{margin:5px 0 0;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:1px}.version-badge{align-self:flex-start;padding:6px 9px;border:1px solid var(--line-strong);border-radius:7px;background:rgba(255,255,255,.56);color:var(--muted);font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace}
.search-box{height:41px;display:grid;grid-template-columns:18px minmax(0,1fr);align-items:center;gap:9px;padding:0 12px;border:1px solid rgba(210,216,212,.8);border-radius:9px;background:rgba(255,255,255,.64)}.search-box:focus-within{border-color:#b9c0bb;background:#fff;box-shadow:0 0 0 3px rgba(70,80,74,.045)}.search-box svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2}.search-box input{width:100%;min-width:0;border:0;background:transparent;font-size:13px}

/* 唯一强焦点：今日任务 */
.today-focus{max-height:255px;display:flex;flex-direction:column;overflow:hidden;padding:15px 13px 12px;border:1px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.13),transparent 35%),linear-gradient(145deg,var(--focus-800),var(--focus-950));box-shadow:0 13px 28px rgba(24,56,44,.19)}
.today-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.today-eyebrow{margin-bottom:4px;color:rgba(255,255,255,.58);font-size:9px;font-weight:750;letter-spacing:1.2px}.today-title{margin:0;font-size:20px;font-weight:760}.today-summary{margin:4px 0 0;color:rgba(255,255,255,.66);font-size:11px}.today-date{padding:5px 8px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.09);color:rgba(255,255,255,.82);font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.today-list,.repository-list{min-height:0;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding-right:2px;scrollbar-width:thin}.today-list{margin-top:10px;scrollbar-color:rgba(255,255,255,.27) transparent}.repository-list{flex:1;scrollbar-color:var(--line-strong) transparent}.today-list::-webkit-scrollbar,.repository-list::-webkit-scrollbar{width:5px}.today-list::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(255,255,255,.24)}.repository-list::-webkit-scrollbar-thumb{border-radius:999px;background:var(--line-strong)}
.today-item,.repository-item{position:relative;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .14s,border-color .14s,box-shadow .14s}
.today-item{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.075)}.today-item:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.13)}.today-item.active{border-color:rgba(255,255,255,.5);background:#fff}.today-item.active::before,.repository-item.active::before{content:"";position:absolute;top:7px;bottom:7px;left:-1px;width:3px;border-radius:0 3px 3px 0}.today-item.active::before{background:#82ae95}
.repository-item{border:1px solid transparent;background:rgba(255,255,255,.52)}.repository-item:hover{border-color:var(--line-strong);background:rgba(255,255,255,.82)}.repository-item.active{border-color:#c8ceca;background:#fff;box-shadow:0 2px 8px rgba(39,50,44,.04)}.repository-item.active::before{background:#87918b}
.today-item-title,.repository-title{display:block;overflow:hidden;font-size:13px;font-weight:680;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}.today-item-title{color:#fff}.repository-title{color:var(--ink)}.today-item.active .today-item-title,.repository-item.active .repository-title{color:var(--ink);font-weight:760}.task-hint{display:block;margin-top:4px;padding-left:7px;overflow:hidden;border-left:2px solid #d6dbd8;color:var(--muted);font-size:10.5px;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}.today-item .task-hint{border-left-color:rgba(255,255,255,.28);color:rgba(255,255,255,.61)}.today-item.active .task-hint{border-left-color:var(--focus-300);color:var(--muted)}.today-priority,.repository-priority{padding:3px 6px;border-radius:5px;font-size:9.5px;white-space:nowrap}.today-priority{background:rgba(255,255,255,.11);color:rgba(255,255,255,.8)}.today-item.active .today-priority,.repository-priority{background:#eef0ee;color:#737b76}
.repository{min-height:138px;flex:1;display:flex;flex-direction:column;overflow:hidden}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;padding:0 3px;color:var(--text-secondary);font-size:12px;font-weight:730}.section-count{color:var(--soft);font-size:10px;font-weight:550}

/* 分组保持弱化 */
.group-panel{flex:0 0 auto;min-height:72px;display:flex;flex-direction:column;padding:9px 9px 8px;overflow:hidden;border:1px solid var(--line-strong);border-radius:10px;background:rgba(255,255,255,.34)}.group-panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.group-panel-title{color:var(--text-secondary);font-size:11px;font-weight:750}.group-panel-hint{color:var(--soft);font-size:9px;white-space:nowrap}.group-list{min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;padding:1px 2px 5px 1px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;overscroll-behavior-inline:contain}.group-list::-webkit-scrollbar{height:4px}.group-list::-webkit-scrollbar-thumb{border-radius:999px;background:var(--line-strong)}.group-row{min-height:30px;flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.5);color:var(--muted);cursor:pointer;user-select:none}.group-row:hover{border-color:#c3c9c5;background:rgba(255,255,255,.82);color:var(--ink)}.group-row.active{border-color:#adb5b0;background:#fff;color:var(--ink);box-shadow:0 2px 7px rgba(40,50,44,.05)}.group-name{max-width:115px;overflow:hidden;font-size:10.5px;font-weight:620;text-overflow:ellipsis;white-space:nowrap}.group-count{min-width:19px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;border-radius:999px;background:#eef0ee;color:#7b837e;font-size:9px;font-weight:650}.group-row.active .group-count{background:#eef0ee;color:#7b837e}
.sidebar-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 3px 0;border-top:1px solid var(--line-strong)}.footer-left{display:flex;align-items:center;gap:8px}.settings-button{width:31px;height:31px;display:grid;place-items:center;padding:0;border:1px solid var(--line-strong);border-radius:8px;background:rgba(255,255,255,.65);color:var(--muted);font-size:15px}.settings-button:hover,.settings-button.active{border-color:#bdc4bf;background:#fff;color:var(--ink)}.autosave-text{color:var(--muted);font-size:10px}.text-button{padding:0;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:650}

/* 主区全部退为中性 */
.main{min-width:0;height:100vh;display:flex;flex-direction:column;background:var(--surface)}.topbar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 38px 9px}.breadcrumb{overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.topbar-actions{display:flex;align-items:center;gap:10px}.secondary-button{min-height:36px;padding:0 13px;border:1px solid var(--line-strong);border-radius:8px;background:rgba(255,255,255,.72);color:var(--muted);font-size:12px;font-weight:650}.secondary-button:hover{border-color:#bcc3be;background:#fff;color:var(--ink)}.icon-button{width:36px;height:36px;min-height:36px;display:grid;place-items:center;padding:0}.icon-button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon-button:hover svg{transform:translateY(1px)}.language-switcher{display:flex;align-items:center;padding:3px;border:1px solid var(--line-strong);border-radius:9px;background:rgba(255,255,255,.72)}.language-button{min-width:48px;height:29px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;font-weight:650}.language-button.active{background:#555d58;color:#fff}
.workspace{min-height:0;flex:1;display:flex;flex-direction:column;gap:22px;padding:9px 38px 32px;overflow-y:auto}.task-header h2{margin:0;color:var(--ink);font-size:28px;font-weight:770;line-height:1.25;letter-spacing:-.75px}.task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:10px;color:var(--muted);font-size:12px}.task-priority-text{color:#626b65;font-weight:760}.meta-divider{color:var(--line-strong)}
.context-panel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;padding:17px;border:1px solid var(--line-strong);border-radius:14px;background:#f7f8f7}.context-field{min-width:0;display:flex;flex-direction:column;gap:7px}.context-field+.context-field{padding-left:17px;border-left:1px solid var(--line-strong)}.context-field label{color:#68716b;font-size:11px;font-weight:760;letter-spacing:.35px}.context-field textarea{width:100%;min-height:82px;padding:7px;resize:none;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);font-size:13px;line-height:1.65}.context-field textarea:focus{border-color:#bbc2bd;background:#fff;box-shadow:0 0 0 3px rgba(64,73,67,.04)}
.main-section{min-height:0;flex:1;display:flex;flex-direction:column}.tabs-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line-strong)}.tabs{display:flex;align-items:center;gap:27px}.tab-button{position:relative;padding:10px 0;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:570}.tab-button.active{color:var(--ink);font-weight:760}.tab-button.active::after{content:"";position:absolute;right:0;bottom:-1px;left:0;height:2px;background:#6e7771}.tab-actions{display:flex;gap:8px;padding-bottom:7px}.pane{display:none;min-height:0;flex:1;padding-top:15px}.pane.active{display:flex;flex-direction:column}

/* 处理流：结构清楚，但色彩克制 */
.flow-panel{min-height:365px;flex:1;display:flex;flex-direction:column}.flow-head,.flow-row{display:grid;grid-template-columns:minmax(280px,var(--flow-col-process)) minmax(180px,var(--flow-col-record)) minmax(90px,var(--flow-col-status)) minmax(105px,var(--flow-col-time));gap:16px}.flow-head{padding:10px 12px;border-bottom:1px solid var(--line-strong);color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.35px}.flow-head-cell{position:relative;min-width:0;display:flex;align-items:center}.flow-column-resizer{position:absolute;top:-10px;right:-8px;bottom:-10px;z-index:20;width:16px;padding:0;border:0;background:transparent;cursor:col-resize;touch-action:none}.flow-column-resizer::before{content:"";position:absolute;top:7px;bottom:7px;left:50%;width:1px;border-radius:999px;background:var(--line-strong);opacity:.62;transform:translateX(-50%)}.flow-column-resizer:hover::before,.flow-column-resizer:focus-visible::before,.flow-column-resizer.active::before{width:2px;background:#8b938e;opacity:1}.flow-column-resizer:focus-visible{outline:none}body.flow-column-resizing,body.flow-column-resizing *{cursor:col-resize!important;user-select:none!important}.flow-body{min-height:285px;flex:1}
.flow-sequence{position:relative}.flow-sequence::before{content:"";position:absolute;top:29px;bottom:29px;left:41px;width:1px;background:#d4d9d6;pointer-events:none}.flow-stage{position:relative;padding-left:60px}.flow-stage:not(.last-stage){padding-bottom:8px}.flow-stage:not(.last-stage)>.flow-row:last-of-type{border-bottom-color:transparent}.main-sequence-rail{position:absolute;top:0;left:0;width:60px;height:58px;pointer-events:none}.main-sequence-rail::after{content:"";position:absolute;top:29px;left:41px;width:13px;height:1px;background:#c8ceca}.main-sequence-rail::before{content:"";position:absolute;top:26px;left:38px;z-index:2;width:7px;height:7px;border:2px solid var(--surface);border-radius:50%;background:#8f9892;box-shadow:0 0 0 1px #d2d7d3}.sequence-index,.flow-stage.stage-done .sequence-index,.flow-stage.stage-doing .sequence-index,.flow-stage.stage-waiting .sequence-index,.flow-stage.stage-todo .sequence-index{position:absolute;top:19px;left:0;width:31px;color:#717a74;font:760 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px;text-align:right}
.flow-row{--indent:calc(var(--level,0)*28px);position:relative;align-items:center;min-height:58px;padding:8px 12px;border-bottom:1px solid var(--line-soft);background:transparent;box-shadow:none;transition:background .14s}.flow-row.root-row{background:#f7f8f7}.flow-row:hover,.flow-row.root-row:hover{background:#f4f6f4}.flow-node-cell{position:relative;min-width:0;display:flex;align-items:center;gap:7px;padding-left:var(--indent)}.flow-node-cell::before{content:"";position:absolute;left:calc(var(--indent) + 10px);top:-9px;bottom:-9px;width:1px;background:transparent}.flow-row.child-row .flow-node-cell::before{background:#d7dcd9}.flow-row.child-row .flow-node-cell::after{content:"";position:absolute;left:calc(var(--indent) - 18px);top:50%;width:18px;height:1px;background:#d7dcd9}
.node-toggle{position:relative;z-index:2;width:21px;height:21px;flex:0 0 auto;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:14px}.node-toggle:hover{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}.node-toggle.placeholder{visibility:hidden}.node-state-line{width:3px;height:28px;flex:0 0 auto;border-radius:999px;background:var(--todo)}.node-state-line.done{background:var(--done)}.node-state-line.doing{background:var(--doing)}.node-state-line.waiting{background:var(--waiting)}.node-main{min-width:0;flex:1}.node-title-input{width:100%;padding:4px 5px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink);font-size:14px;font-weight:670}.root-row .node-title-input{font-weight:760}.node-title-input:focus{border-color:#bdc4bf;background:#fff;box-shadow:0 0 0 3px rgba(60,69,63,.04)}.node-relation{display:flex;align-items:center;gap:5px;min-width:0;padding:0 5px;color:var(--soft);font-size:10px;line-height:1.35}.relation-mark,.root-row .relation-mark,.root-row .node-relation{color:#929a95}.relation-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-record-trigger{width:100%;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 6px;border:0;border-bottom:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);text-align:left}.node-record-trigger:hover,.node-record-trigger:focus-visible{border-bottom-color:#cbd0cd;background:rgba(255,255,255,.7);color:var(--ink)}.record-preview{min-width:0;overflow:hidden;font-size:13px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.record-preview.empty{color:var(--soft);font-style:italic}.record-open-icon{flex:0 0 auto;color:#858e88;font-size:11px;opacity:.58}.node-record-trigger:hover .record-open-icon,.node-record-trigger:focus-visible .record-open-icon{opacity:1}
/* 状态以形态区分，避免依赖大面积颜色 */
.flow-row.status-done .node-title-input,
.flow-row.status-done .record-preview{
  text-decoration:line-through;
  text-decoration-thickness:1px;
  text-decoration-color:#929a95;
}
.flow-row.status-done .node-title-input,
.flow-row.status-done .node-relation,
.flow-row.status-done .node-record-trigger,
.flow-row.status-done .node-time{opacity:.58}
.flow-row.status-done:hover .node-title-input,
.flow-row.status-done:hover .node-relation,
.flow-row.status-done:hover .node-record-trigger,
.flow-row.status-done:hover .node-time,
.flow-row.status-done:focus-within .node-title-input,
.flow-row.status-done:focus-within .node-relation,
.flow-row.status-done:focus-within .node-record-trigger,
.flow-row.status-done:focus-within .node-time{opacity:.78}
.flow-row.status-doing .node-title-input{font-weight:790}
.flow-row.status-waiting .node-title-input{font-style:italic;font-weight:640}
.flow-row.status-todo .node-title-input{font-weight:620}

.node-state-line.todo{
  width:4px;
  background:transparent;
  border:1px solid var(--todo);
  opacity:.58;
}
.node-state-line.doing{width:4px;height:32px;background:var(--doing)}
.node-state-line.waiting{
  width:4px;
  background:repeating-linear-gradient(to bottom,var(--waiting) 0 4px,transparent 4px 7px);
  border-radius:0;
}
.node-state-line.done{height:20px;background:var(--done);opacity:.7}

.status-select{width:100%;min-height:30px;padding:5px 24px 5px 10px;border:1px solid #dce1de;border-radius:999px;background:#f5f6f5;font-size:11px;font-weight:760;line-height:1.2;cursor:pointer}
.status-select.todo{color:var(--todo);background:#fafbfa}
.status-select.done{color:var(--done);text-decoration:line-through;opacity:.72;background:#f7f8f7}
.status-select.doing{color:var(--doing);font-weight:820;box-shadow:inset 3px 0 0 rgba(128,111,75,.72)}
.status-select.waiting{color:var(--waiting);border-style:dashed;font-style:italic;background:#fafbfa}
.status-select:hover,.status-select:focus{border-color:#c8ceca;box-shadow:0 0 0 3px rgba(64,72,67,.035)}
.status-select.doing:hover,.status-select.doing:focus{box-shadow:inset 3px 0 0 rgba(128,111,75,.72),0 0 0 3px rgba(64,72,67,.035)}
.node-time{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.flow-footer{margin-top:auto;padding:18px 8px 4px;border-top:1px dashed var(--line-strong);color:var(--muted);font-size:11px;text-align:center}

/* 笔记、历史、浮窗 */
.note-editor{width:100%;min-height:400px;padding:21px;resize:vertical;border:1px solid var(--line-strong);border-radius:11px;background:#fafbfa;color:var(--ink);font-size:14px;line-height:1.78}.note-editor:focus{border-color:#bdc4bf;background:#fff}.history-list{display:flex;flex-direction:column;gap:15px;padding:6px 5px 20px}.history-item{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding-left:20px;font-size:13px;line-height:1.58}.history-item::before{content:"";position:absolute;top:7px;left:0;width:4px;height:14px;border-radius:3px;background:var(--line-strong)}.history-item:first-child::before{background:#7f8882}.history-time{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.history-text{color:var(--text-secondary)}.empty-state{padding:32px 16px;color:var(--muted);font-size:12px;text-align:center}

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-row">
        <div>
          <h1 class="brand-title">Task Track</h1>
          <p class="brand-subtitle" id="brandSubtitle"></p>
        </div>
        <span class="version-badge">v1.3.1</span>
      </div>

      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35"></path><circle cx="10.8" cy="10.8" r="7.2"></circle></svg>
        <input id="searchInput" type="text" />
      </label>

      <section class="today-focus">
        <div class="today-header">
          <div>
            <div class="today-eyebrow" id="todayEyebrow"></div>
            <h2 class="today-title" id="todayTitle"></h2>
            <p class="today-summary" id="todaySummary"></p>
          </div>
          <span class="today-date" id="todayDate">--/--</span>
        </div>
        <div class="today-list" id="todayList"></div>
      </section>

      <section class="repository" id="repositoryPanel">
        <div class="section-heading"><span id="repositoryTitle"></span><span class="section-count" id="taskCount"></span></div>
        <div class="repository-list" id="repositoryList"></div>
      </section>

      <section class="group-panel" id="groupPanel">
        <div class="group-panel-header"><span class="group-panel-title" id="groupPanelTitle"></span><span class="group-panel-hint" id="groupPanelHint"></span></div>
        <div class="group-list" id="groupList"></div>
      </section>

      <footer class="sidebar-footer">
        <div class="footer-left"><button class="settings-button" id="settingsButton" type="button">⚙</button><span class="autosave-text" id="autosaveText"></span></div>
        <button class="text-button" id="resetButton" type="button"></button>
      </footer>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="topbar-actions">
          <button
            class="secondary-button icon-button"
            id="exportButton"
            type="button"
            aria-label="导出数据"
            title="导出数据"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v11"></path>
              <path d="m8 10 4 4 4-4"></path>
              <path d="M5 18v2h14v-2"></path>
            </svg>
          </button>
          <div class="language-switcher" aria-label="Language">
            <button class="language-button active" data-language="zh" type="button">中文</button>
            <button class="language-button" data-language="en" type="button">EN</button>
          </div>
        </div>
      </div>

      <div class="workspace">
        <header class="task-header">
          <h2 id="taskTitle">--</h2>
          <div class="task-meta"><span class="task-priority-text" id="taskPriority">--</span><span class="meta-divider">•</span><span id="taskStatus">--</span><span class="meta-divider">•</span><span id="taskNodeCount">--</span><span class="meta-divider">•</span><span id="taskGroup">--</span></div>
        </header>

        <section class="context-panel">
          <div class="context-field"><label for="backgroundInput" id="backgroundLabel"></label><textarea id="backgroundInput"></textarea></div>
          <div class="context-field"><label for="progressInput" id="progressLabel"></label><textarea id="progressInput"></textarea></div>
          <div class="context-field"><label for="resultInput" id="resultLabel"></label><textarea id="resultInput"></textarea></div>
        </section>

        <section class="main-section">
          <div class="tabs-row">
            <div class="tabs">
              <button class="tab-button active" data-tab="flow" id="flowTab" type="button"></button>
              <button class="tab-button" data-tab="notes" id="notesTab" type="button"></button>
              <button class="tab-button" data-tab="history" id="historyTab" type="button"></button>
            </div>
            <div class="tab-actions"><button class="secondary-button" id="toggleAllButton" type="button"></button></div>
          </div>

          <div class="pane active" id="flowPane">
            <div class="flow-panel">
              <div class="flow-head" id="flowHead">
                <div class="flow-head-cell">
                  <span id="nodeNameHeader"></span>
                  <button class="flow-column-resizer" data-resize-index="0" type="button" role="separator" aria-orientation="vertical"></button>
                </div>
                <div class="flow-head-cell">
                  <span id="nodeRecordHeader"></span>
                  <button class="flow-column-resizer" data-resize-index="1" type="button" role="separator" aria-orientation="vertical"></button>
                </div>
                <div class="flow-head-cell">
                  <span id="nodeStatusHeader"></span>
                  <button class="flow-column-resizer" data-resize-index="2" type="button" role="separator" aria-orientation="vertical"></button>
                </div>
                <div class="flow-head-cell"><span id="nodeUpdatedHeader"></span></div>
              </div>
              <div class="flow-body" id="flowBody"></div>
              <div class="flow-footer" id="flowFooter"></div>
            </div>
          </div>
          <div class="pane" id="notesPane"><textarea class="note-editor" id="noteInput"></textarea></div>
          <div class="pane" id="historyPane"><div class="history-list" id="historyList"></div></div>
        </section>
      </div>
    </main>
  </div>


  <div class="record-modal-backdrop" id="recordModal" aria-hidden="true">
    <section class="record-modal" role="dialog" aria-modal="true" aria-labelledby="recordModalTitle">
      <header class="record-modal-header">
        <div class="record-modal-heading">
          <h3 class="record-modal-title" id="recordModalTitle"></h3>
          <p class="record-modal-description" id="recordModalDescription"></p>
        </div>
        <button class="record-modal-close" id="recordModalClose" type="button" aria-label="Close">×</button>
      </header>

      <div class="record-modal-context">
        <span class="record-modal-node-title" id="recordModalNodeTitle"></span>
        <span class="record-modal-node-meta" id="recordModalNodeMeta"></span>
      </div>

      <div class="record-modal-body">
        <textarea class="record-modal-textarea" id="recordModalInput"></textarea>
      </div>

      <footer class="record-modal-footer">
        <span class="record-modal-shortcut" id="recordModalShortcut"></span>
        <div class="record-modal-actions">
          <button class="record-modal-button" id="recordModalCancel" type="button"></button>
          <button class="record-modal-button primary" id="recordModalSave" type="button"></button>
        </div>
      </footer>
    </section>
  </div>

  <aside class="settings-popover" id="settingsPopover">
    <div class="settings-header"><h3 class="settings-title" id="settingsTitle"></h3><span class="settings-version">v1.3.1</span></div>
    <div class="settings-section-title" id="displaySettingsTitle"></div>
    <div class="setting-row"><div><div class="setting-label" id="compactModeLabel"></div><div class="setting-description" id="compactModeDescription"></div></div><button class="switch" id="compactModeSwitch" type="button"></button></div>
    <div class="setting-row"><div><div class="setting-label" id="updatedTimeLabel"></div><div class="setting-description" id="updatedTimeDescription"></div></div><button class="switch on" id="updatedTimeSwitch" type="button"></button></div>
    <div class="setting-row"><div><div class="setting-label" id="deleteConfirmLabel"></div><div class="setting-description" id="deleteConfirmDescription"></div></div><button class="switch on" id="deleteConfirmSwitch" type="button"></button></div>
  </aside>

  <div class="context-menu" id="contextMenu"></div>
  <div class="toast" id="toast"></div>

    const DEFAULT_FLOW_COLUMN_RATIOS = [42,32,12,14];

    function getFlowColumnRatios(){
      const candidate=Array.isArray(settings.flowColumnRatios)?settings.flowColumnRatios:DEFAULT_FLOW_COLUMN_RATIOS;
      if(candidate.length!==4||candidate.some(value=>!Number.isFinite(Number(value))||Number(value)<=0)){
        settings.flowColumnRatios=[...DEFAULT_FLOW_COLUMN_RATIOS];
        return [...DEFAULT_FLOW_COLUMN_RATIOS];
      }
      const values=candidate.map(Number);
      const sum=values.reduce((total,value)=>total+value,0);
      return values.map(value=>value/sum*100);
    }

    function applyFlowColumnWidths(){
      const ratios=getFlowColumnRatios();
      const root=document.documentElement;
      root.style.setProperty("--flow-col-process",`${ratios[0]}fr`);

      root.style.setProperty("--flow-col-status",`${ratios[2]}fr`);
      root.style.setProperty("--flow-col-time",`${ratios[3]}fr`);
    }

    function enableFlowColumnResize(){
      const head=$("#flowHead");
      if(!head)return;

      $$(".flow-column-resizer").forEach(handle=>{
        handle.addEventListener("pointerdown",event=>{
          if(window.matchMedia("(max-width: 870px)").matches)return;

          const index=Number(handle.dataset.resizeIndex);
          const cells=[...head.querySelectorAll(".flow-head-cell")].filter(cell=>getComputedStyle(cell).display!=="none");
          if(index<0||index>=cells.length-1)return;

          event.preventDefault();
          event.stopPropagation();

          const startRatios=getFlowColumnRatios();
          const startWidths=cells.map(cell=>cell.getBoundingClientRect().width);
          const minimumWidths=[220,140,78,92];
          const startX=event.clientX;
          const minDelta=minimumWidths[index]-startWidths[index];
          const maxDelta=startWidths[index+1]-minimumWidths[index+1];
          const pairRatio=startRatios[index]+startRatios[index+1];

          handle.classList.add("active");
          document.body.classList.add("flow-column-resizing");

          const onMove=moveEvent=>{
            const delta=Math.max(minDelta,Math.min(maxDelta,moveEvent.clientX-startX));
            const leftWidth=startWidths[index]+delta;
            const rightWidth=startWidths[index+1]-delta;
            const pairWidth=leftWidth+rightWidth;
            const next=[...startRatios];
            next[index]=pairRatio*(leftWidth/pairWidth);
            next[index+1]=pairRatio*(rightWidth/pairWidth);
            settings.flowColumnRatios=next;
            applyFlowColumnWidths();
          };

          const onEnd=()=>{
            handle.classList.remove("active");
            document.body.classList.remove("flow-column-resizing");
            window.removeEventListener("pointermove",onMove);
            window.removeEventListener("pointerup",onEnd);
            window.removeEventListener("pointercancel",onEnd);
            saveSettings();
          };

          window.addEventListener("pointermove",onMove);
          window.addEventListener("pointerup",onEnd);
          window.addEventListener("pointercancel",onEnd);
        });

        handle.addEventListener("dblclick",event=>{
          event.preventDefault();
          event.stopPropagation();
          resetFlowColumnWidths(true);
        });

        handle.addEventListener("keydown",event=>{
          if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;
          const index=Number(handle.dataset.resizeIndex);
          const ratios=getFlowColumnRatios();
          if(index<0||index>=ratios.length-1)return;
          event.preventDefault();
          const step=event.shiftKey?3:1;
          const direction=event.key==="ArrowRight"?1:-1;
          const minimumRatios=[18,12,7,8];
          const delta=step*direction;
          const next=[...ratios];
          const proposedLeft=next[index]+delta;
          const proposedRight=next[index+1]-delta;
          if(proposedLeft<minimumRatios[index]||proposedRight<minimumRatios[index+1])return;
          next[index]=proposedLeft;
          next[index+1]=proposedRight;
          settings.flowColumnRatios=next;
          applyFlowColumnWidths();
          saveSettings();
        });
      });
    }

    }

    function saveRecordModal(){
      if(activeRecordNodeId===null)return;
      const task=currentTask();
      const info=findNodeInfo(task?.nodes||[],activeRecordNodeId);
      if(!info){closeRecordModal();return;}
      const value=$("#recordModalInput").value;
      const previous=loc(info.node.record);
      if(value!==previous){
        info.node.record=setLoc(info.node.record,value);
        info.node.updated=nowText();
        pushHistory(task,`更新节点“${loc(info.node.title)}”的记录。`,`Updated the record for node “${loc(info.node.title)}”.`);
        saveData();
      }
      closeRecordModal();
      renderAll();
      showToast(t("recordUpdated"));
    }

    function updateNodeField(id,field,value){const task=currentTask();const info=findNodeInfo(task.nodes,id);if(!info)return;if(field==="status")info.node.status=value;else info.node[field]=setLoc(info.node[field],value);info.node.updated=nowText();pushHistory(task,`更新节点“${loc(info.node.title)}”。`,`Updated node “${loc(info.node.title)}”.`);saveData();renderAll();showToast(t("saved"));}
    function toggleNode(id){const info=findNodeInfo(currentTask().nodes,id);if(!info)return;info.node.collapsed=!info.node.collapsed;saveData();renderFlow();}
    function makeNode(title,relation){return{id:createId(),title:bi(title,title),record:bi("",""),relation,status:"todo",updated:nowText(),collapsed:false,children:[]};}
    function addRootNode(){const task=currentTask();const title=prompt(t("promptNodeName"),t("defaultNodeName"));if(!title?.trim())return;task.nodes.push(makeNode(title.trim(),bi("承接前一处理步骤","Follows the previous workflow step")));saveData();renderAll();showToast(t("created"));}
    function addSiblingNode(id){const task=currentTask();const info=findNodeInfo(task.nodes,id);if(!info)return;const title=prompt(t("promptNodeName"),t("defaultNodeName"));if(!title?.trim())return;info.container.splice(info.index+1,0,makeNode(title.trim(),bi(`承接“${loc(info.node.title)}”`,`Follows “${loc(info.node.title)}”`)));saveData();renderAll();showToast(t("created"));}
    function addChildNode(id){const task=currentTask();const info=findNodeInfo(task.nodes,id);if(!info)return;const title=prompt(t("promptNodeName"),t("defaultChildName"));if(!title?.trim())return;info.node.children||=[];info.node.children.push(makeNode(title.trim(),bi(`属于“${loc(info.node.title)}”`,`Part of “${loc(info.node.title)}”`)));info.node.collapsed=false;saveData();renderAll();showToast(t("created"));}
    function deleteNode(id){const task=currentTask();const info=findNodeInfo(task.nodes,id);if(!info||!confirmAction(t("confirmNodeDelete",{name:loc(info.node.title)})))return;info.container.splice(info.index,1);saveData();renderAll();showToast(t("deleted"));}
    function setCollapsed(nodes,collapsed){nodes.forEach(n=>{n.collapsed=collapsed;setCollapsed(n.children||[],collapsed);});}
    function toggleAllNodes(){allExpanded=!allExpanded;setCollapsed(currentTask().nodes||[],!allExpanded);saveData();renderStaticText();renderFlow();}

    function createTask(){const name=prompt(t("promptTaskName"),t("defaultTaskName"));if(!name?.trim())return;const groupId=selectedGroupId!=="all"?selectedGroupId:"ungrouped";const task={id:createId(),title:bi(name.trim(),name.trim()),priority:"normal",status:"todo",groupId,today:false,background:bi("",""),progress:bi("",""),result:bi("",""),notes:bi("",""),history:[],nodes:[]};data.tasks.unshift(task);currentTaskId=task.id;saveData();renderAll();showToast(t("created"));}
    function renameTask(id){const task=data.tasks.find(x=>x.id===id);if(!task)return;const name=prompt(t("promptTaskName"),loc(task.title));if(!name?.trim())return;task.title=setLoc(task.title,name.trim());saveData();renderAll();showToast(t("renamed"));}
    function toggleToday(id){const task=data.tasks.find(x=>x.id===id);if(!task)return;task.today=!task.today;saveData();renderAll();showToast(t("saved"));}
    function moveTaskToGroup(id,groupId){const task=data.tasks.find(x=>x.id===id);if(!task)return;task.groupId=groupId;saveData();renderAll();showToast(t("moved"));}
    function deleteTask(id){if(data.tasks.length<=1){showToast(t("taskLimit"));return;}const task=data.tasks.find(x=>x.id===id);if(!task||!confirmAction(t("confirmTaskDelete",{name:loc(task.title)})))return;data.tasks=data.tasks.filter(x=>x.id!==id);if(currentTaskId===id)currentTaskId=data.tasks[0]?.id??null;saveData();renderAll();showToast(t("deleted"));}

    function createGroup(){const name=prompt(t("promptGroupName"),t("defaultGroupName"));if(!name?.trim())return;const g={id:`group-${createId()}`,name:bi(name.trim(),name.trim()),system:false};data.groups.push(g);selectedGroupId=g.id;saveData();renderAll();showToast(t("created"));}
    function renameGroup(id){const g=findGroup(id);if(!g)return;if(g.system){showToast(t("protectedGroup"));return;}const name=prompt(t("promptGroupName"),loc(g.name));if(!name?.trim())return;g.name=setLoc(g.name,name.trim());saveData();renderAll();showToast(t("renamed"));}
    function deleteGroup(id){const g=findGroup(id);if(!g)return;if(g.system){showToast(t("protectedGroup"));return;}if(!confirmAction(t("confirmGroupDelete",{name:loc(g.name)})))return;data.tasks.forEach(x=>{if(x.groupId===id)x.groupId="ungrouped";});data.groups=data.groups.filter(x=>x.id!==id);if(selectedGroupId===id)selectedGroupId="all";saveData();renderAll();showToast(t("deleted"));}

    function renderHistory(){const history=[...(currentTask()?.history||[])].reverse();$("#historyList").innerHTML=history.length?history.map(x=>`<div class="history-item"><span class="history-time">${escapeHtml(x.time)}</span><span class="history-text">${escapeHtml(loc(x.text))}</span></div>`).join(""):`<div class="empty-state">${escapeHtml(t("emptyHistory"))}</div>`;}
    function updateTaskText(field,value){const task=currentTask();task[field]=setLoc(task[field],value);saveData();}
    function switchTab(name){$$(".tab-button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));$$(".pane").forEach(p=>p.classList.remove("active"));$("#"+name+"Pane").classList.add("active");}
    function applySettings(){document.body.classList.toggle("compact-mode",settings.compactMode);document.body.classList.toggle("hide-updated-time",!settings.showUpdatedTime);$("#compactModeSwitch").classList.toggle("on",settings.compactMode);$("#updatedTimeSwitch").classList.toggle("on",settings.showUpdatedTime);$("#deleteConfirmSwitch").classList.toggle("on",settings.confirmDelete);applyFlowColumnWidths();}
    function setLanguage(lang){if(activeRecordNodeId!==null)closeRecordModal();settings.language=lang;saveSettings();renderAll();}

    function showContextMenu(e,items){const menu=$("#contextMenu");menu.innerHTML="";items.forEach(item=>{if(item.divider){const d=document.createElement("div");d.className="context-menu-divider";menu.appendChild(d);return;}if(item.section){const d=document.createElement("div");d.className="context-menu-label";d.textContent=item.section;menu.appendChild(d);return;}const b=document.createElement("button");b.type="button";b.textContent=item.label;if(item.danger)b.classList.add("danger");b.onclick=ev=>{ev.stopPropagation();hideContextMenu();item.action();};menu.appendChild(b);});menu.style.left=e.clientX+"px";menu.style.top=e.clientY+"px";menu.classList.add("open");requestAnimationFrame(()=>{const r=menu.getBoundingClientRect();if(r.right>innerWidth-8)menu.style.left=(innerWidth-r.width-8)+"px";if(r.bottom>innerHeight-8)menu.style.top=(innerHeight-r.height-8)+"px";});}
    function hideContextMenu(){$("#contextMenu").classList.remove("open");}
    function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="task-track-data.json";a.click();URL.revokeObjectURL(url);showToast(t("exported"));}
    function resetData(){if(!confirm(t("resetConfirm")))return;data=initialData();currentTaskId=data.tasks[0].id;selectedGroupId="all";allExpanded=true;saveData();renderAll();showToast(t("resetDone"));}
    function renderAll(){renderStaticText();applySettings();renderGroups();renderSidebarTasks();renderCurrentTask();}

    document.addEventListener("DOMContentLoaded",()=>{
      const d=new Date();$("#todayDate").textContent=`${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
      renderAll();enableGroupWheelScroll();enableFlowColumnResize();
      $("#searchInput").addEventListener("input",renderSidebarTasks);
      $$(".language-button").forEach(b=>b.onclick=()=>setLanguage(b.dataset.language));
      $("#exportButton").onclick=exportData;$("#resetButton").onclick=resetData;$("#toggleAllButton").onclick=toggleAllNodes;
      $("#recordModalClose").onclick=closeRecordModal;
      $("#recordModalCancel").onclick=closeRecordModal;
      $("#recordModalSave").onclick=saveRecordModal;
      $("#recordModal").onclick=e=>{if(e.target===$("#recordModal"))closeRecordModal();};
      $("#recordModalInput").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();saveRecordModal();}});
      [["backgroundInput","background"],["progressInput","progress"],["resultInput","result"],["noteInput","notes"]].forEach(([id,field])=>$("#"+id).addEventListener("input",e=>updateTaskText(field,e.target.value)));
      $$(".tab-button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
      $("#repositoryPanel").ondblclick=e=>{if(!e.target.closest(".repository-item"))createTask();};
      $("#repositoryPanel").oncontextmenu=e=>{if(e.target.closest(".repository-item"))return;e.preventDefault();showContextMenu(e,[{label:t("createTask"),action:createTask}]);};
      $("#groupPanel").ondblclick=e=>{if(!e.target.closest(".group-row"))createGroup();};
      $("#groupPanel").oncontextmenu=e=>{if(e.target.closest(".group-row"))return;e.preventDefault();showContextMenu(e,[{label:t("createGroup"),action:createGroup}]);};
      $("#flowBody").ondblclick=e=>{if(!e.target.closest(".flow-row"))addRootNode();};
      $("#flowBody").oncontextmenu=e=>{if(e.target.closest(".flow-row"))return;e.preventDefault();showContextMenu(e,[{label:t("addRoot"),action:addRootNode}]);};
      $("#settingsButton").onclick=e=>{e.stopPropagation();const p=$("#settingsPopover");const open=!p.classList.contains("open");p.classList.toggle("open",open);$("#settingsButton").classList.toggle("active",open);};
      $("#settingsPopover").onclick=e=>e.stopPropagation();
      $("#compactModeSwitch").onclick=()=>{settings.compactMode=!settings.compactMode;saveSettings();applySettings();};
      $("#updatedTimeSwitch").onclick=()=>{settings.showUpdatedTime=!settings.showUpdatedTime;saveSettings();applySettings();};
      $("#deleteConfirmSwitch").onclick=()=>{settings.confirmDelete=!settings.confirmDelete;saveSettings();applySettings();};
      document.addEventListener("click",e=>{hideContextMenu();if(!e.target.closest("#settingsPopover")&&!e.target.closest("#settingsButton")){ $("#settingsPopover").classList.remove("open");$("#settingsButton").classList.remove("active"); }});
      document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#recordModal").classList.contains("open"))closeRecordModal();});
      window.addEventListener("resize",hideContextMenu);window.addEventListener("scroll",hideContextMenu,true);
    });
  </script>
</body>
</html>
