<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>处理流 · 方案 1 Demo</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
      body { overflow: hidden; background: #f5f7f5; }
      iframe { display: block; }
    </style>
  </head>
  <body>
    <iframe id="taskTrack" title="仅更新处理流的任务页" src="task-track.html"></iframe>
    <script>
      const frame = document.getElementById('taskTrack');

      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;

        const style = doc.createElement('style');
        style.textContent = `
          /* 仅覆盖处理流区域，其余页面结构和样式完全沿用 task-track.html */
          #flowPane { padding-top: 11px; }
          .flow-panel { min-height: 365px; }
          .flow-panel { --flow-rail: #c8d3cc; }
          .flow-head,
          .flow-row {
            grid-template-columns: 34px minmax(276px, .92fr) minmax(250px, 1.38fr) 72px 108px;
            gap: 0;
          }
          .flow-head {
            min-height: 36px;
            padding: 0 12px;
            color: #7c8781;
            font-size: 11px;
            font-weight: 720;
            letter-spacing: .08em;
          }
          .flow-head-cell { min-width: 0; }
          .flow-head-cell:nth-child(1) { grid-column: 2; padding-left: 21px; }
          .flow-head-cell:nth-child(2) {
            grid-column: 3;
            padding-left: 18px;
            border-left: 1px solid #edf0ee;
          }
          .flow-head-cell:nth-child(3),
          .flow-head-cell:nth-child(4) {
            visibility: hidden;
            pointer-events: none;
          }
          .flow-head-cell:nth-child(3) { grid-column: 4; }
          .flow-head-cell:nth-child(4) { grid-column: 5; }
          .flow-column-resizer { display: none; }

          .flow-sequence::before { display: none; }
          .flow-row {
            align-items: center;
            min-height: 54px;
            padding: 0 12px;
            border-bottom: 1px solid #e8ece9;
            background: transparent;
          }
          .flow-row.root-row { min-height: 61px; background: #f8f9f8; }
          .flow-row:hover,
          .flow-row.root-row:hover { background: #f3f6f3; }
          .flow-row.child-row { min-height: 48px; }
          .new-sequence {
            display: flex;
            align-items: center;
            align-self: stretch;
            color: #88938d;
            font: 700 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          }
          .flow-node-cell {
            position: relative;
            gap: 0;
            padding-left: 0;
          }
          .flow-node-cell::before,
          .flow-row.child-row .flow-node-cell::after { display: none; }
          .root-marker {
            width: 3px;
            height: 23px;
            flex: 0 0 auto;
            margin-right: 13px;
            border-radius: 99px;
            background: var(--flow-rail);
          }
          .root-marker.done,
          .root-marker.doing,
          .root-marker.waiting,
          .root-marker.todo { background: var(--flow-rail); }
          .flow-row.root-row:has(+ .child-row) .flow-node-cell::after {
            content: "";
            position: absolute;
            top: 50%;
            bottom: -31px;
            left: 1px;
            width: 1px;
            background: var(--flow-rail);
          }
          .flow-row.child-row .flow-node-cell {
            padding-left: calc(var(--tree-depth) * 22px + 14px);
          }
          .tree-guides {
            position: absolute;
            inset: 0 auto 0 0;
            width: calc(var(--tree-depth) * 22px + 2px);
            pointer-events: none;
          }
          .tree-rail {
            position: absolute;
            top: -24px;
            bottom: 50%;
            left: calc(var(--rail-index) * 22px + 1px);
            width: 1px;
            background: var(--flow-rail);
          }
          .tree-rail.continues { bottom: -24px; }
          .tree-elbow {
            position: absolute;
            top: 50%;
            left: calc((var(--tree-depth) - 1) * 22px + 1px);
            width: 20px;
            height: 1px;
            background: var(--flow-rail);
          }
          .node-toggle {
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
            visibility: hidden;
          }
          .node-state-line { display: none; }
          .node-main { min-width: 0; }
          .node-title-input {
            padding: 4px 5px;
            color: #2a372f;
            font-size: 13px;
            font-weight: 660;
          }
          .root-row .node-title-input { font-weight: 760; }
          .child-row .node-title-input { color: #546158; font-size: 12px; font-weight: 560; }
          .node-relation { display: none; }

          .new-record-cell {
            min-width: 0;
            padding-left: 18px;
            border-left: 1px solid #edf0ee;
          }
          .node-record-trigger {
            min-height: 30px;
            justify-content: flex-start;
            padding: 5px 6px;
            border-radius: 5px;
            color: #5c6961;
          }
          .record-preview { font-size: 12px; }
          .record-preview.empty { color: #a4ada7; font-style: normal; }
          .record-open-icon { display: none; }
          .new-state-cell {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
          }
          .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #8c9891;
          }
          .status-dot.done { background: #66776c; }
          .status-dot.doing { background: #a57b3d; }
          .status-dot.waiting { background: #72808a; }
          .status-dot.todo { background: #9aa39e; }
          .status-select {
            width: auto;
            min-height: 28px;
            padding: 2px 0;
            border: 0;
            border-radius: 0;
            appearance: none;
            background: transparent;
            color: #617068;
            font-size: 11px;
            font-weight: 700;
            text-align: right;
            box-shadow: none;
          }
          .status-select.done {
            color: #66776c;
            text-decoration: none;
            opacity: .88;
            background: transparent;
          }
          .status-select.doing {
            color: #9b7134;
            font-weight: 780;
            box-shadow: none;
          }
          .status-select.waiting {
            color: #6a7981;
            border: 0;
            font-style: normal;
            background: transparent;
          }
          .status-select.todo { background: transparent; }
          .status-select:hover,
          .status-select:focus,
          .status-select.doing:hover,
          .status-select.doing:focus { box-shadow: 0 0 0 3px rgba(64, 72, 67, .06); }
          .node-time {
            justify-self: end;
            padding-left: 17px;
            color: #89938e;
            font-size: 10px;
          }
          .flow-row.status-done .node-title-input,
          .flow-row.status-done .record-preview {
            text-decoration: none;
            opacity: .72;
          }
          .flow-row.status-done .node-time { opacity: .72; }
          .flow-footer { display: none; }
        `;
        doc.head.appendChild(style);

        win.renderNodeRow = function renderNodeRow(node, level, parentTitle = "", rootIndex = 0, lineage = [], isLast = true) {
          const has = (node.children || []).length > 0;
          const state = win.statusClass(node.status);
          const recordText = win.loc(node.record).trim();
          const treeDepth = Math.min(level, 3);
          const sequence = level === 0
            ? `<span>${String(rootIndex + 1).padStart(2, "0")}</span>`
            : "";
          const railContinuations = [...lineage, !isLast].slice(0, treeDepth);
          const guides = level > 0
            ? `<span class="tree-guides">${Array.from({ length: treeDepth }, (_, index) => `<span class="tree-rail ${railContinuations[index] ? "continues" : ""}" style="--rail-index:${index}"></span>`).join("")}<span class="tree-elbow"></span></span>`
            : "";
          return `<div class="flow-row ${level === 0 ? "root-row" : "child-row"} status-${state}" style="--level:${level};--tree-depth:${treeDepth}" data-node-id="${node.id}">
            <div class="new-sequence">${sequence}</div>
            <div class="flow-node-cell">
              ${level === 0 ? `<span class="root-marker ${state}" aria-hidden="true"></span>` : ""}
              ${guides}
              <button type="button" class="node-toggle ${has ? "" : "placeholder"}" data-toggle-id="${node.id}">${has ? (node.collapsed ? "+" : "−") : ""}</button>
              <div class="node-main">
                <input class="node-title-input" data-node-id="${node.id}" data-node-field="title" value="${win.escapeHtml(win.loc(node.title))}"/>
              </div>
            </div>
            <div class="new-record-cell">
              <button class="node-record-trigger" type="button" data-record-node-id="${node.id}" title="${win.escapeHtml(recordText || win.t("recordEmptyPreview"))}">
                <span class="record-preview ${recordText ? "" : "empty"}">${win.escapeHtml(recordText || win.t("recordEmptyPreview"))}</span>
              </button>
            </div>
            <div class="new-state-cell">
              <span class="status-dot ${state}" aria-hidden="true"></span>
              <select class="status-select ${state}" data-node-id="${node.id}" data-node-field="status">${["todo", "doing", "waiting", "done"].map(s => `<option value="${s}" ${s === node.status ? "selected" : ""}>${win.escapeHtml(win.statusText(s))}</option>`).join("")}</select>
            </div>
            <div class="node-time">${win.escapeHtml(node.updated || "--")}</div>
          </div>`;
        };

        function renderTreeRows(nodes, level = 0, lineage = []) {
          return nodes.map((node, index) => {
            const isLast = index === nodes.length - 1;
            const row = win.renderNodeRow(node, level, "", level === 0 ? index : 0, lineage, isLast);
            const children = (node.children || []).length && !node.collapsed
              ? renderTreeRows(node.children, level + 1, level === 0 ? [] : [...lineage, !isLast])
              : "";
            return row + children;
          }).join("");
        }
        win.renderChildRows = function renderChildRows(nodes, level = 1) {
          return renderTreeRows(nodes, level);
        };
        win.renderMainStages = function renderMainStages(nodes) {
          return renderTreeRows(nodes);
        };

        win.renderFlow();
      });
    </script>
  </body>
</html>
