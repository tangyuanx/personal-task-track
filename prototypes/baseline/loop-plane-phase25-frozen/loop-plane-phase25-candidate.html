let searchMatches=[],searchIndex=0;
function findGlobalMatches(query){
 const q=query.trim().toLowerCase(),contains=text=>String(text||'').toLowerCase().includes(q),result=[];
 for(const t of tasks){
  if([t.title,t.description,t.progress,t.conclusion,t.notes].some(contains))result.push({taskId:t.id,nodeId:null,kind:isQuick(t)?'quick':'task',title:t.title,path:t.group,excerpt:[t.description,t.progress,t.conclusion,t.notes].find(contains)||''});
  if(!isQuick(t))for(const n of flat(t.nodes))if(contains(n.title)||contains(n.note))result.push({taskId:t.id,nodeId:n.id,kind:'node',title:n.title,path:t.title+' / '+getPath(t.nodes,n.id).slice(0,-1).map(p=>p.title).join(' / '),excerpt:contains(n.note)?n.note:''});
 }

let pendingNodeRecord=null,nodeRecordTimer=null;

function moveFlowNode(id,targetId,placement){
 const t=currentTask(),path=getPath(t.nodes,id),node=path.at(-1),targetPath=targetId?getPath(t.nodes,targetId):[],target=targetPath.at(-1);
 if(!node||targetId===id||(targetId&&flat([node]).some(n=>n.id===targetId)))return false;
 const source=path.at(-2)?.children||t.nodes;source.splice(source.indexOf(node),1);
 if(placement==='inside'){target.children.push(node);target.collapsed=false}
 else if(!target)t.nodes.push(node);
 else{const destination=targetPath.at(-2)?.children||t.nodes;destination.splice(destination.indexOf(target)+(placement==='after'?1:0),0,node)}
 touchTask(t);t.history.unshift(['刚刚','调整「'+node.title+'」的位置']);state.menu=false;render();$('.node-title[data-node="'+id+'"]')?.focus({preventScroll:true});return true;
}
function moveNodeWithKeyboard(id,direction){
 const t=currentTask(),path=getPath(t.nodes,id),n=path.at(-1),parent=path.at(-2),siblings=parent?.children||t.nodes,index=siblings.indexOf(n);
 closeOverlay();
 if(direction==='up'&&index>0)moveFlowNode(id,siblings[index-1].id,'before');
 if(direction==='down'&&index<siblings.length-1)moveFlowNode(id,siblings[index+1].id,'after');
 if(direction==='in'&&index>0)moveFlowNode(id,siblings[index-1].id,'inside');
 if(direction==='out'&&parent)moveFlowNode(id,parent.id,'after');
}
