<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Track Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #202522; color: #fff; font: 14px system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; min-height: 100vh; }
      figure { margin: 0; background: #111; overflow: hidden; }
      figcaption { height: 34px; display: flex; align-items: center; padding: 0 12px; background: #26312b; font-weight: 700; }
      img { display: block; width: 100%; height: auto; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source · task-track.html v1.3.1</figcaption>
        <img src="./source-v1.3.1.png" alt="Source design" />
      </figure>
      <figure>
        <figcaption>Implementation · Personal Task Track v0.1.45</figcaption>
        <img src="./implementation-final-desktop.png?final=3" alt="Production implementation" />
      </figure>
    </main>
  </body>
</html>
