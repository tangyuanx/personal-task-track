<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>今日任务柔和对比 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #eef2ef;
      --paper-deep: #e5ebe7;
      --ink: #20322b;
      --muted: #71847c;
      --moss-700: #174c3b;
      --moss-950: #0d3026;
      --task-ink: #f7fbf8;
      --task-muted: rgba(231, 245, 238, 0.66);
      --bookmark: #b7decf;
      --focus-ring: rgba(183, 222, 207, 0.32);
      --sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.92), transparent 30rem),
        linear-gradient(145deg, var(--paper), var(--paper-deep));
      color: var(--ink);
      font-family: var(--sans);
    }

    button {
      font: inherit;
    }

    .demo-shell {
      width: min(920px, calc(100% - 36px));
      margin: 0 auto;
      padding: 32px 0 42px;
    }

    .demo-toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 4px 16px;
    }

    .demo-heading span {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font: 650 11px/1 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .demo-heading h1 {
      margin: 0;
      font-size: clamp(19px, 2.5vw, 25px);
      font-weight: 720;
      letter-spacing: -0.03em;
    }

    .variant-switch {
      display: inline-flex;
      flex: 0 0 auto;
      gap: 3px;
      padding: 3px;
      border: 1px solid rgba(32, 50, 43, 0.11);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 8px 18px rgba(38, 61, 51, 0.05);
    }

    .variant-switch button {
      min-height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .variant-switch button[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(25, 54, 42, 0.1);
    }

    .demo-stage {
      padding: clamp(17px, 3vw, 28px);
      border: 1px solid rgba(46, 75, 63, 0.09);
      border-radius: 24px;
      background: rgba(249, 251, 249, 0.72);
      box-shadow: 0 24px 70px rgba(25, 52, 41, 0.12);
    }

    .workbench-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 7px 22px;
      color: #6d8078;
    }

    .workbench-label strong {
      font-size: 17px;
      font-weight: 690;
      letter-spacing: 0.02em;
    }

    .workbench-label span {
      font: 11px/1 var(--mono);
      letter-spacing: 0.05em;
    }

    /* The component keeps the production class names so the state treatment maps directly. */
    .today-panel.today-focus {
      position: relative;
      display: grid;
      gap: 18px;
      margin: 0;
      padding: clamp(22px, 4vw, 30px) clamp(18px, 4vw, 28px) clamp(20px, 4vw, 28px);
      overflow: hidden;
      border: 1px solid rgba(183, 222, 207, 0.22);
      border-radius: 26px;
      background:
        radial-gradient(ellipse 330px 170px at 100% 0%, rgba(202, 232, 219, 0.16), transparent 72%),
        linear-gradient(140deg, var(--moss-700), var(--moss-950));
      box-shadow:
        0 18px 38px rgba(15, 55, 42, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .today-headline {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 0 1px;
    }

    .today-headline strong {
      flex: 0 0 auto;
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 730;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .today-date {
      flex: 0 0 auto;
      color: rgba(235, 248, 242, 0.7);
      font: clamp(15px, 2.2vw, 20px)/1 var(--mono);
      letter-spacing: 0.02em;
    }

    .today-headline > span {
      margin-left: auto;
      color: rgba(235, 248, 242, 0.7);
      font-size: clamp(15px, 2.1vw, 19px);
      font-weight: 570;
      white-space: nowrap;
    }

    .today-headline b {
      color: #fff;
      font-size: 1.15em;
      font-weight: 760;
    }

    .focus-list.focus-stack {
      display: grid;
      gap: 2px;
    }

    .focus-row.focus-item {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      min-height: 82px;
      margin: 0;
      padding: 12px 20px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: var(--task-ink);
      cursor: pointer;
      isolation: isolate;
      transition:
        background-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .focus-row.focus-item:hover {
      background: rgba(255, 255, 255, 0.045);
    }

    .focus-row .row-title {
      min-width: 0;
    }

    .focus-row .row-title strong,
    .focus-row .row-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 160ms ease;
    }

    .focus-row .row-title strong {
      color: rgba(247, 251, 248, 0.93);
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 680;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    .focus-row .row-title span {
      margin-top: 3px;
      color: var(--task-muted);
      font-size: clamp(15px, 2.5vw, 20px);
      line-height: 1.35;
    }

    /* Proposed state: same text family, a quiet wash, and one short bookmark rail. */
    .demo-stage[data-variant="soft"] .focus-row.focus-item.selected {
      background: linear-gradient(90deg, rgba(224, 245, 236, 0.09), rgba(255, 255, 255, 0.035) 68%, transparent);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.025);
    }

    .demo-stage[data-variant="soft"] .focus-row.focus-item.selected::before {
      position: absolute;
      top: 15px;
      bottom: 15px;
      left: 0;
      width: 3px;
      border-radius: 99px;
      background: var(--bookmark);
      box-shadow: 0 0 16px var(--focus-ring);
      content: "";
    }

    .demo-stage[data-variant="soft"] .focus-row.focus-item.selected .row-title strong {
      color: #fff;
    }

    .demo-stage[data-variant="soft"] .focus-row.focus-item.selected .row-title span {
      color: rgba(236, 248, 242, 0.74);
    }

    /* Comparison state reproduces the screenshot's competing border and dark selected copy. */
    .demo-stage[data-variant="current"] .focus-list.focus-stack {
      gap: 8px;
    }

    .demo-stage[data-variant="current"] .focus-row.focus-item {
      border: 2px solid transparent;
    }

    .demo-stage[data-variant="current"] .focus-row.focus-item.selected {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.07);
    }

    .demo-stage[data-variant="current"] .focus-row.focus-item.selected .row-title strong {
      color: #12382f;
    }

    .demo-stage[data-variant="current"] .focus-row.focus-item.selected .row-title span {
      color: #799087;
    }

    .focus-row.focus-item:active {
      transform: scale(0.992);
    }

    .focus-row.focus-item:focus-visible {
      outline: 2px solid var(--bookmark);
      outline-offset: 3px;
      box-shadow: 0 0 0 5px var(--focus-ring);
    }

    .demo-caption {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 22px;
      margin: 15px 7px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .demo-caption::before {
      width: 18px;
      height: 1px;
      flex: 0 0 auto;
      background: #9eb4aa;
      content: "";
    }

    @media (max-width: 640px) {
      .demo-shell {
        width: min(100% - 22px, 920px);
        padding-top: 18px;
      }

      .demo-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .demo-stage {
        border-radius: 18px;
      }

      .workbench-label {
        margin-bottom: 16px;
      }

      .today-panel.today-focus {
        gap: 14px;
        border-radius: 20px;
      }

      .today-headline {
        gap: 10px;
      }

      .focus-row.focus-item {
        min-height: 66px;
        padding-right: 12px;
        padding-left: 14px;
      }
    }

    @media (max-width: 420px) {
      .today-headline {
        flex-wrap: wrap;
      }

      .today-headline > span {
        margin-left: 0;
        flex-basis: 100%;
      }

      .focus-row .row-title strong,
      .focus-row .row-title span {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <header class="demo-toolbar">
      <div class="demo-heading">
        <span>Today Focus / State Study</span>
        <h1>让选中态回到同一个任务层级</h1>
      </div>
      <div class="variant-switch" role="group" aria-label="对比显示方式">
        <button type="button" data-variant-button="current" aria-pressed="false">原样</button>
        <button type="button" data-variant-button="soft" aria-pressed="true">柔化后</button>
      </div>
    </header>

    <section class="demo-stage" data-variant="soft">
      <div class="workbench-label">
        <strong>个人任务工作台</strong>
        <span>UI DEMO · 01</span>
      </div>

      <section class="today-focus today-panel" aria-label="今日待办">
        <div class="today-headline">
          <strong>今日任务</strong>
          <time class="today-date" datetime="2026-07-18">07/18</time>
          <span><b>2</b> 项待推进</span>
        </div>
        <div class="focus-list focus-stack">
          <article
            class="focus-item focus-row normal"
            role="button"
            tabindex="0"
            aria-pressed="false"
            data-task-id="task-interface"
          >
            <span class="row-title">
              <strong>修改整体的界面简约简单</strong>
              <span>下一步：补充任务背景或新增第一个节点</span>
            </span>
          </article>
          <article
            class="focus-item focus-row normal selected"
            role="button"
            tabindex="0"
            aria-pressed="true"
            data-task-id="task-pin-today"
          >
            <span class="row-title">
              <strong>左上右上角置顶显示今日任务</strong>
              <span>下一步：补充任务背景或新增第一个节点</span>
            </span>
          </article>
        </div>
      </section>

      <p class="demo-caption" aria-live="polite">
        选中项只增加柔和底色与左侧短标记；文字不再突然变暗。点击任务可切换选中态。
      </p>
    </section>
  </main>

  <script>
    const stage = document.querySelector(".demo-stage");
    const caption = document.querySelector(".demo-caption");
    const variantButtons = [...document.querySelectorAll("[data-variant-button]")];
    const focusItems = [...document.querySelectorAll(".focus-item")];

    function selectVariant(variant) {
      stage.dataset.variant = variant;
      variantButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.variantButton === variant));
      });
      caption.textContent =
        variant === "soft"
          ? "选中项只增加柔和底色与左侧短标记；文字不再突然变暗。点击任务可切换选中态。"
          : "原样同时使用完整描边、背景和深色文字，选中项容易被看成禁用状态。";
    }

    function selectFocusItem(selectedItem) {
      focusItems.forEach((item) => {
        const selected = item === selectedItem;
        item.classList.toggle("selected", selected);
        item.setAttribute("aria-pressed", String(selected));
      });
    }

    variantButtons.forEach((button) => {
      button.addEventListener("click", () => selectVariant(button.dataset.variantButton));
    });

    focusItems.forEach((item) => {
      item.addEventListener("click", () => selectFocusItem(item));
      item.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectFocusItem(item);
        }
      });
    });
  </script>
</body>
</html>
