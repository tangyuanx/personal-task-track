<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <title>今日任务置顶窗口 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --forest: #0b4a3b;
      --forest-deep: #06362d;
      --forest-soft: #17604e;
      --paper: #f7faf7;
      --mist: #e8efeb;
      --ink: #183129;
      --muted: #70867d;
      --line: #cbd8d1;
      --amber: #d4a44d;
      --widget-width: 360px;
      --screen-gap: 22px;
      --widget-font-scale: 1;
      --zh-font: "TaskTrack Widget Chinese System";
      --en-font: "TaskTrack Widget English Inter";
      --widget-font: var(--en-font), var(--zh-font), sans-serif;
      --widget-focus: #2e5d49;
      --widget-focus-deep: #17392d;
      --widget-inset-highlight: rgba(255, 255, 255, 0.09);
      --widget-bg:
        radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.13), transparent 35%),
        linear-gradient(145deg, var(--widget-focus), var(--widget-focus-deep));
      --widget-border: rgba(255, 255, 255, 0.1);
      --widget-title: #ffffff;
      --widget-text: #ffffff;
      --widget-muted: rgba(255, 255, 255, 0.68);
      --widget-control: rgba(255, 255, 255, 0.72);
      --widget-control-hover: rgba(255, 255, 255, 0.1);
      --widget-task-bg: rgba(255, 255, 255, 0.075);
      --widget-task-border: rgba(255, 255, 255, 0.07);
      --widget-task-hover: rgba(255, 255, 255, 0.12);
      --widget-check-border: rgba(255, 255, 255, 0.52);
      --widget-divider: rgba(255, 255, 255, 0.09);
      --widget-menu-bg: rgba(250, 252, 250, 0.98);
      --widget-menu-ink: #183129;
      --widget-menu-muted: #71857c;
      --widget-menu-line: #d9e2dd;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --widget-menu-bg: rgba(250, 252, 250, 0.98);
      --widget-menu-ink: #183129;
      --widget-menu-muted: #71857c;
      --widget-menu-line: #d9e2dd;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --widget-focus: #1c4d38;
      --widget-focus-deep: #0d1610;
      --widget-bg:
        radial-gradient(ellipse 150px 75px at 100% 0%, rgba(150, 210, 175, 0.22), transparent 100%),
        linear-gradient(145deg, var(--widget-focus), var(--widget-focus-deep));
      --widget-menu-bg: rgba(28, 40, 34, 0.98);
      --widget-menu-ink: #e2eee7;
      --widget-menu-muted: #9eb1a7;
      --widget-menu-line: #405249;
    }

    @font-face { font-family: "TaskTrack Widget English Inter"; src: url("./src/assets/fonts/InterVariable.woff2") format("woff2"), local("Inter"), local("Segoe UI"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English System"; src: local("SF Pro Text"), local("Segoe UI"), local("Arial"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Segoe"; src: local("Segoe UI"), local("Arial"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Arial"; src: local("Arial"), local("Helvetica"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Helvetica"; src: local("Helvetica"), local("Arial"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Verdana"; src: local("Verdana"), local("Arial"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Trebuchet"; src: local("Trebuchet MS"), local("Segoe UI"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Tahoma"; src: local("Tahoma"), local("Segoe UI"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Times"; src: local("Times New Roman"), local("Times"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Georgia"; src: local("Georgia"), local("Times New Roman"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Courier"; src: local("Courier New"), local("Consolas"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget English Mono"; src: local("SFMono-Regular"), local("Cascadia Mono"), local("Consolas"); unicode-range: U+0000-024F, U+0370-052F, U+2000-214F; }
    @font-face { font-family: "TaskTrack Widget Chinese System"; src: local("PingFang SC"), local("Microsoft YaHei"), url("./src/assets/fonts/NotoSansCJKsc-Regular.otf") format("opentype"); }
    @font-face { font-family: "TaskTrack Widget Chinese System"; src: local("PingFang SC"), local("Microsoft YaHei"), url("./src/assets/fonts/NotoSansCJKsc-Bold.otf") format("opentype"); font-weight: 700 900; }
    @font-face { font-family: "TaskTrack Widget Chinese Noto"; src: url("./src/assets/fonts/NotoSansCJKsc-Regular.otf") format("opentype"); }
    @font-face { font-family: "TaskTrack Widget Chinese Noto"; src: url("./src/assets/fonts/NotoSansCJKsc-Bold.otf") format("opentype"); font-weight: 700 900; }

    :root[data-zh-font="system"] { --zh-font: "TaskTrack Widget Chinese System"; }
    :root[data-zh-font="noto"] { --zh-font: "TaskTrack Widget Chinese Noto"; }
    :root[data-zh-font="yahei"] { --zh-font: "Microsoft YaHei", "微软雅黑"; }
    :root[data-zh-font="pingfang"] { --zh-font: "PingFang SC", "苹方-简"; }
    :root[data-zh-font="songti"] { --zh-font: "Songti SC", "STSong"; }
    :root[data-zh-font="simsun"] { --zh-font: "SimSun", "宋体"; }
    :root[data-zh-font="fangsong"] { --zh-font: "FangSong", "仿宋"; }
    :root[data-zh-font="heiti"] { --zh-font: "Heiti SC", "SimHei"; }
    :root[data-zh-font="kaiti"] { --zh-font: "KaiTi", "Kaiti SC"; }
    :root[data-en-font="system"] { --en-font: "TaskTrack Widget English System"; }
    :root[data-en-font="segoe"] { --en-font: "TaskTrack Widget English Segoe"; }
    :root[data-en-font="arial"] { --en-font: "TaskTrack Widget English Arial"; }
    :root[data-en-font="helvetica"] { --en-font: "TaskTrack Widget English Helvetica"; }
    :root[data-en-font="verdana"] { --en-font: "TaskTrack Widget English Verdana"; }
    :root[data-en-font="trebuchet"] { --en-font: "TaskTrack Widget English Trebuchet"; }
    :root[data-en-font="tahoma"] { --en-font: "TaskTrack Widget English Tahoma"; }
    :root[data-en-font="times"] { --en-font: "TaskTrack Widget English Times"; }
    :root[data-en-font="georgia"] { --en-font: "TaskTrack Widget English Georgia"; }
    :root[data-en-font="courier"] { --en-font: "TaskTrack Widget English Courier"; }
    :root[data-en-font="mono"] { --en-font: "TaskTrack Widget English Mono"; }

    :root[data-zh-font="songti"],
    :root[data-zh-font="simsun"],
    :root[data-zh-font="fangsong"],
    :root[data-zh-font="kaiti"] {
      -webkit-font-smoothing: auto;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: #dfe7e2;
      color: var(--ink);
      font-family: var(--widget-font);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input { font: inherit; }

    button { color: inherit; }

    button:focus-visible {
      outline: 2px solid #70b99f;
      outline-offset: 2px;
    }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;
      background:
        linear-gradient(rgba(247, 250, 247, 0.9), rgba(247, 250, 247, 0.9)),
        linear-gradient(90deg, transparent 0 25%, rgba(42, 76, 64, 0.08) 25% 25.08%, transparent 25.08%),
        #eef3ef;
    }

    .desktop::after {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: rgba(230, 237, 232, 0.28);
      backdrop-filter: blur(1.4px);
      content: "";
      pointer-events: none;
    }

    .mock-app {
      display: grid;
      grid-template-columns: minmax(280px, 26vw) 1fr;
      min-height: 100%;
      color: #62766d;
      user-select: none;
    }

    .mock-sidebar {
      padding: 28px 22px;
      border-right: 1px solid rgba(104, 128, 117, 0.22);
      background: rgba(238, 244, 240, 0.88);
    }

    .mock-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      color: #29463b;
      font-weight: 730;
    }

    .mock-brand small {
      color: #899b93;
      font: 10px ui-monospace, SFMono-Regular, Consolas, monospace;
      font-weight: 500;
    }

    .mock-today {
      min-height: 160px;
      padding: 16px;
      border-radius: 14px;
      background: #dce8e1;
    }

    .mock-today strong { color: #50685e; }

    .mock-lines {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }

    .mock-lines i {
      display: block;
      height: 30px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.62);
    }

    .mock-repository { margin-top: 30px; }

    .mock-repository > span {
      display: block;
      width: 74px;
      height: 10px;
      border-radius: 4px;
      background: #b9c9c0;
    }

    .mock-row {
      display: grid;
      grid-template-columns: 26px 1fr 48px;
      gap: 12px;
      align-items: center;
      height: 52px;
      margin-top: 8px;
      padding: 0 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.52);
    }

    .mock-row::before,
    .mock-row::after,
    .mock-row span {
      height: 8px;
      border-radius: 4px;
      background: #c4d2cb;
      content: "";
    }

    .mock-main { padding: 64px clamp(42px, 7vw, 120px); }

    .mock-main h1 {
      margin: 0;
      color: #6b7f76;
      font-size: clamp(26px, 3vw, 44px);
    }

    .mock-main p {
      width: min(640px, 86%);
      height: 10px;
      margin: 22px 0 0;
      border-radius: 5px;
      background: #cbd7d1;
      box-shadow: 0 30px 0 #d7e0db, 0 60px 0 #d7e0db;
    }

    .screen-note {
      position: absolute;
      left: 50%;
      bottom: 22px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 9px;
      transform: translateX(-50%);
      padding: 9px 13px;
      border: 1px solid rgba(127, 149, 138, 0.24);
      border-radius: 9px;
      background: rgba(247, 250, 247, 0.92);
      box-shadow: 0 10px 28px rgba(41, 68, 57, 0.09);
      color: #63796f;
      font-size: 12px;
      white-space: nowrap;
    }

    .screen-note i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4d9d7f;
      box-shadow: 0 0 0 4px rgba(77, 157, 127, 0.12);
    }

    .today-widget {
      position: absolute;
      z-index: 10;
      width: min(var(--widget-width), calc(100vw - 24px));
      overflow: visible;
      border: 1px solid var(--widget-border);
      border-radius: 16px;
      background: var(--widget-bg);
      box-shadow: inset 0 1px 0 var(--widget-inset-highlight);
      opacity: var(--widget-opacity, 1);
      transition: width 180ms ease, height 180ms ease, opacity 160ms ease, transform 180ms ease;
    }

    .today-widget.is-click-through {
      border-color: color-mix(in srgb, var(--widget-border) 58%, transparent);
      box-shadow: 0 8px 24px rgba(27, 56, 45, 0.08), inset 0 1px 0 var(--widget-inset-highlight);
    }

    .today-widget.is-click-through .widget-header {
      border-bottom-color: color-mix(in srgb, var(--widget-divider) 55%, transparent);
    }

    .today-widget.is-click-through .widget-tools,
    .today-widget.is-click-through .widget-resize-handle {
      display: none;
    }

    .today-widget.is-click-through .widget-content {
      padding-top: 7px;
      padding-bottom: 7px;
    }

    .today-widget.is-click-through .today-task {
      min-height: 48px;
      border-color: color-mix(in srgb, var(--widget-task-border) 60%, transparent);
      background: color-mix(in srgb, var(--widget-task-bg) 72%, transparent);
    }

    .today-widget[data-position="top-left"] { top: var(--screen-gap); left: var(--screen-gap); }
    .today-widget[data-position="top-right"] { top: var(--screen-gap); right: var(--screen-gap); }
    .today-widget[data-position="bottom-left"] { bottom: calc(var(--screen-gap) + 40px); left: var(--screen-gap); }
    .today-widget[data-position="bottom-right"] { right: var(--screen-gap); bottom: calc(var(--screen-gap) + 40px); }

    .today-widget.is-dragging {
      transition: none;
    }

    .today-widget.is-resizing {
      transition: none;
    }

    .widget-resize-handle {
      position: absolute;
      right: 12px;
      left: 12px;
      z-index: 30;
      display: none;
      height: 8px;
      cursor: ns-resize;
      touch-action: none;
    }

    .widget-resize-handle.top { top: 0; }
    .widget-resize-handle.bottom { bottom: 0; }

    .widget-resize-handle::after {
      position: absolute;
      right: 42%;
      left: 42%;
      height: 2px;
      border-radius: 99px;
      background: transparent;
      content: "";
      transition: background 120ms ease;
    }

    .widget-resize-handle.top::after { top: 2px; }
    .widget-resize-handle.bottom::after { bottom: 2px; }
    .widget-resize-handle:hover::after { background: var(--widget-control); }

    .today-widget.is-hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    .widget-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-height: 49px;
      padding: 7px 8px 6px 15px;
      border-bottom: 1px solid var(--widget-divider);
      cursor: grab;
      user-select: none;
    }

    .is-dragging .widget-header { cursor: grabbing; }

    .widget-title {
      display: flex;
      min-width: 0;
      align-items: baseline;
      gap: 10px;
    }

    .widget-title strong {
      color: var(--widget-title);
      font-size: calc(15px * var(--widget-font-scale));
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    .widget-title time {
      color: var(--widget-muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: calc(10px * var(--widget-font-scale));
    }

    .widget-tools {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .icon-button {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--widget-control);
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button[aria-expanded="true"] {
      background: var(--widget-control-hover);
      color: var(--widget-title);
    }

    .icon-button svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .compact-expand-icon { display: none; }
    .today-widget.is-compact .compact-collapse-icon { display: none; }
    .today-widget.is-compact .compact-expand-icon { display: block; }

    .widget-content { padding: 10px; }

    .task-list {
      display: grid;
      gap: 5px;
    }

    .today-task {
      position: relative;
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr) 18px;
      gap: 9px;
      align-items: center;
      min-height: 60px;
      padding: 9px 8px;
      overflow: hidden;
      border: 1px solid var(--widget-task-border);
      border-radius: 10px;
      background: var(--widget-task-bg);
      cursor: pointer;
      transition: opacity 170ms ease, transform 170ms ease, max-height 190ms ease, padding 190ms ease, border-width 190ms ease;
    }

    .today-task:hover {
      border-color: var(--widget-check-border);
      background: var(--widget-task-hover);
    }

    .today-task.is-completing {
      max-height: 0;
      min-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      transform: translateX(18px);
    }

    .task-check {
      position: relative;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 1.5px solid var(--widget-check-border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.035);
      cursor: pointer;
    }

    .task-check:hover {
      border-color: var(--widget-title);
      background: var(--widget-control-hover);
    }

    .task-copy { min-width: 0; }

    .task-copy strong,
    .task-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-copy strong {
      color: var(--widget-text);
      font-size: calc(12.5px * var(--widget-font-scale));
      font-weight: 680;
      letter-spacing: -0.01em;
    }

    .task-copy span {
      margin-top: 4px;
      color: var(--widget-muted);
      font-size: calc(10.5px * var(--widget-font-scale));
    }

    .task-state {
      width: 6px;
      height: 6px;
      justify-self: center;
      border-radius: 50%;
      background: #75bb9d;
    }

    .today-task.high .task-state { background: #e6b65d; }

    .today-task.blocked .task-state {
      background: #e2876f;
      box-shadow: 0 0 0 4px rgba(226, 135, 111, 0.11);
    }

    .empty-state {
      display: none;
      min-height: 118px;
      place-items: center;
      padding: 22px;
      text-align: center;
    }

    .empty-state.is-visible { display: grid; }

    .empty-state strong {
      display: block;
      color: var(--widget-text);
      font-size: calc(13px * var(--widget-font-scale));
    }

    .empty-state span {
      display: block;
      margin-top: 6px;
      color: var(--widget-muted);
      font-size: calc(10.5px * var(--widget-font-scale));
    }

    .widget-menu {
      position: absolute;
      top: 43px;
      right: 8px;
      z-index: 20;
      width: 220px;
      padding: 12px;
      border: 1px solid var(--widget-menu-line);
      border-radius: 12px;
      background: var(--widget-menu-bg);
      box-shadow: 0 18px 44px rgba(22, 50, 40, 0.22);
      color: var(--widget-menu-ink);
      transform: translateY(-5px) scale(0.98);
      opacity: 0;
      pointer-events: none;
      transform-origin: top right;
      transition: opacity 130ms ease, transform 130ms ease;
    }

    .widget-menu.is-open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .menu-label {
      display: block;
      margin: 0 0 8px;
      color: var(--widget-menu-muted);
      font-size: calc(10px * var(--widget-font-scale));
      font-weight: 700;
    }

    .position-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 11px;
    }

    .position-button {
      position: relative;
      height: 38px;
      padding: 0;
      border: 1px solid #d5dfda;
      border-radius: 8px;
      background: #f4f8f5;
      cursor: pointer;
    }

    .position-button::after {
      position: absolute;
      width: 10px;
      height: 8px;
      border-radius: 2px;
      background: #7f9e90;
      content: "";
    }

    .position-button[data-place="top-left"]::after { top: 6px; left: 6px; }
    .position-button[data-place="top-right"]::after { top: 6px; right: 6px; }
    .position-button[data-place="bottom-left"]::after { bottom: 6px; left: 6px; }
    .position-button[data-place="bottom-right"]::after { right: 6px; bottom: 6px; }

    .position-button.is-active {
      border-color: #438b70;
      background: #e6f1eb;
      box-shadow: inset 0 0 0 1px #438b70;
    }

    .position-button.is-active::after { background: var(--forest); }

    .menu-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 35px;
      border-top: 1px solid #e4ebe7;
      color: #3d584d;
      font-size: calc(11px * var(--widget-font-scale));
      cursor: pointer;
    }

    .switch {
      position: relative;
      width: 29px;
      height: 17px;
      border-radius: 99px;
      background: #becbc5;
      transition: background 140ms ease;
    }

    .switch::after {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(22, 51, 41, 0.2);
      content: "";
      transition: transform 140ms ease;
    }

    input:checked + .switch { background: #3b8b6d; }
    input:checked + .switch::after { transform: translateX(12px); }
    .menu-switch input { position: absolute; opacity: 0; pointer-events: none; }

    .menu-range {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 10px;
      align-items: center;
      min-height: 52px;
      padding: 8px 0;
      border-top: 1px solid var(--widget-menu-line);
      color: var(--widget-menu-ink);
      font-size: calc(11px * var(--widget-font-scale));
    }

    .menu-range output {
      min-width: 34px;
      color: var(--widget-menu-muted);
      font: 650 calc(10px * var(--widget-font-scale)) var(--en-font);
      text-align: right;
    }

    .menu-range input {
      grid-column: 1 / -1;
      width: 100%;
      height: 3px;
      margin: 0;
      accent-color: var(--widget-focus);
      cursor: pointer;
    }

    .menu-hint {
      margin: -3px 0 2px;
      color: var(--widget-menu-muted);
      font-size: calc(10px * var(--widget-font-scale));
      line-height: 1.45;
    }

    .hide-widget {
      width: 100%;
      margin-top: 5px;
      padding: 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #73877e;
      font-size: calc(11px * var(--widget-font-scale));
      text-align: left;
      cursor: pointer;
    }

    .hide-widget:hover { background: #edf3ef; color: #344e43; }

    .today-widget.is-compact { width: 296px; }
    .today-widget.is-compact .widget-content { display: none; }
    .today-widget.is-compact .widget-header { border-bottom: 0; }

    .restore-widget {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 7;
      display: none;
      padding: 9px 12px;
      border: 1px solid #c8d6ce;
      border-radius: 9px;
      background: rgba(249, 252, 249, 0.95);
      box-shadow: 0 10px 24px rgba(33, 62, 51, 0.12);
      color: #38564a;
      font-size: calc(11px * var(--widget-font-scale));
      cursor: pointer;
    }

    .restore-widget.is-visible { display: block; }

    .toast {
      position: absolute;
      left: 50%;
      top: 22px;
      z-index: 30;
      max-width: calc(100vw - 32px);
      transform: translate(-50%, -10px);
      padding: 9px 13px;
      border: 1px solid #d3ddd7;
      border-radius: 9px;
      background: rgba(252, 253, 252, 0.98);
      box-shadow: 0 12px 32px rgba(27, 56, 45, 0.14);
      color: #365146;
      font-size: calc(11px * var(--widget-font-scale));
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .toast.is-visible {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @media (max-width: 720px) {
      :root { --screen-gap: 12px; }
      .desktop { min-height: 540px; }
      .mock-app { grid-template-columns: 1fr; }
      .mock-main { display: none; }
      .mock-sidebar { padding: 22px 14px; }
      .screen-note { bottom: 12px; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
      .today-widget[data-position^="bottom"] { bottom: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }

    body.widget-runtime {
      width: 100vw;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    body.widget-runtime .desktop {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: visible;
      background: transparent;
    }

    body.widget-runtime .desktop::after,
    body.widget-runtime .mock-app,
    body.widget-runtime .screen-note,
    body.widget-runtime .restore-widget { display: none; }

    body.widget-runtime .today-widget {
      position: relative;
      inset: auto !important;
      display: grid;
      width: var(--widget-width);
      height: 100%;
      grid-template-rows: auto minmax(0, 1fr);
      margin: 0;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    body.widget-runtime .today-widget.is-compact { width: 296px; }

    body.widget-runtime .widget-header {
      -webkit-app-region: drag;
    }

    body.widget-runtime .widget-content {
      min-height: 0;
      overflow: hidden;
    }

    body.widget-runtime .task-list {
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body.widget-runtime .task-list::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body.widget-runtime .empty-state {
      height: 100%;
    }

    body.widget-runtime .widget-menu {
      max-height: calc(100vh - 51px);
      overflow-y: auto;
    }

    body.widget-runtime .widget-resize-handle {
      display: block;
      -webkit-app-region: no-drag;
    }

    body.widget-runtime .today-widget.is-compact .widget-resize-handle { display: none; }
    body.widget-runtime.is-resizing-widget { cursor: ns-resize; user-select: none; }

    body.widget-runtime button,
    body.widget-runtime input,
    body.widget-runtime [data-no-drag],
    body.widget-runtime .today-task { -webkit-app-region: no-drag; }

    body.widget-runtime .toast {
      position: fixed;
      top: 12px;
    }
  </style>
</head>
<body>
  <main class="desktop" id="desktop">
    <div class="mock-app" aria-hidden="true">
      <aside class="mock-sidebar">
        <div class="mock-brand"><span>Task Track</span><small>v0.1.113</small></div>
        <section class="mock-today"><strong>今日任务</strong><div class="mock-lines"><i></i><i></i><i></i></div></section>
        <section class="mock-repository"><span></span><div class="mock-row"><span></span></div><div class="mock-row"><span></span></div><div class="mock-row"><span></span></div></section>
      </aside>
      <section class="mock-main"><h1>完善个人任务管理 app</h1><p></p></section>
    </div>

    <section class="today-widget" id="widget" data-position="top-right" aria-label="今日任务置顶窗口">
      <div class="widget-resize-handle top" data-widget-resize="top" role="separator" aria-orientation="horizontal" aria-label="从顶部调整今日窗口高度"></div>
      <header class="widget-header" id="drag-region">
        <div class="widget-title" id="widget-title">
          <strong>今日任务</strong>
          <time id="today-date" datetime="2026-08-16">08/16 周日</time>
        </div>
        <div class="widget-tools" data-no-drag>
          <button class="icon-button" id="open-main" type="button" title="打开主窗口" aria-label="打开主窗口">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8"></path><path d="M17 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h5"></path></svg>
          </button>
          <button class="icon-button" id="compact-toggle" type="button" title="收起" aria-label="收起今日窗口">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="compact-collapse-icon" d="M7 12h10"></path>
              <g class="compact-expand-icon"><path d="M8 3H3v5M3 3l6 6"></path><path d="M16 21h5v-5M21 21l-6-6"></path></g>
            </svg>
          </button>
          <button class="icon-button" id="menu-toggle" type="button" title="窗口设置" aria-label="窗口设置" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
          </button>
        </div>
      </header>

      <div class="widget-content">
        <div class="task-list" id="task-list">
          <article class="today-task high" data-title="完善个人任务管理 app" tabindex="0" role="button">
            <button class="task-check" type="button" aria-label="完成：完善个人任务管理 app"></button>
            <span class="task-copy"><strong>完善个人任务管理 app</strong><span>下一步：确认今日悬浮窗的交互方案</span></span>
            <i class="task-state" title="高优先级"></i>
          </article>
          <article class="today-task" data-title="整理本周工作回顾" tabindex="0" role="button">
            <button class="task-check" type="button" aria-label="完成：整理本周工作回顾"></button>
            <span class="task-copy"><strong>整理本周工作回顾</strong><span>下一步：汇总本周完成的关键节点</span></span>
            <i class="task-state" title="普通"></i>
          </article>
          <article class="today-task blocked" data-title="检查应用更新流程" tabindex="0" role="button">
            <button class="task-check" type="button" aria-label="完成：检查应用更新流程"></button>
            <span class="task-copy"><strong>检查应用更新流程</strong><span>下一步：验证 Windows 自动更新安装</span></span>
            <i class="task-state" title="被阻塞"></i>
          </article>
        </div>
        <div class="empty-state" id="empty-state"><div><strong>今天的任务已完成</strong></div></div>
      </div>

      <aside class="widget-menu" id="widget-menu" aria-label="今日窗口设置" data-no-drag>
        <span class="menu-label">窗口位置</span>
        <div class="position-grid" role="group" aria-label="选择窗口位置">
          <button class="position-button" data-place="top-left" type="button" title="左上角" aria-label="左上角"></button>
          <button class="position-button is-active" data-place="top-right" type="button" title="右上角" aria-label="右上角"></button>
          <button class="position-button" data-place="bottom-left" type="button" title="左下角" aria-label="左下角"></button>
          <button class="position-button" data-place="bottom-right" type="button" title="右下角" aria-label="右下角"></button>
        </div>
        <label class="menu-switch"><span>始终显示在最上层</span><input id="always-on-top" type="checkbox" checked /><i class="switch" aria-hidden="true"></i></label>
        <label class="menu-switch"><span>鼠标穿透显示</span><input id="click-through" type="checkbox" /><i class="switch" aria-hidden="true"></i></label>
        <p class="menu-hint" id="click-through-hint">开启后不拦截下方软件操作，可用 ⌘/Ctrl + Shift + T 恢复。</p>
        <label class="menu-switch"><span>随应用启动</span><input id="launch-with-app" type="checkbox" checked /><i class="switch" aria-hidden="true"></i></label>
        <label class="menu-range" for="widget-opacity"><span>窗口透明度</span><output id="widget-opacity-value" for="widget-opacity">100%</output><input id="widget-opacity" type="range" min="70" max="100" step="1" value="100" /></label>
        <button class="hide-widget" id="hide-widget" type="button">隐藏今日窗口</button>
      </aside>
      <div class="widget-resize-handle bottom" data-widget-resize="bottom" role="separator" aria-orientation="horizontal" aria-label="从底部调整今日窗口高度"></div>
    </section>

    <p class="screen-note"><i aria-hidden="true"></i><span id="position-note">置于右上角 · 可拖动到任意位置</span></p>
    <button class="restore-widget" id="restore-widget" type="button">重新显示今日窗口</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    if (!window.personalTaskTrack?.todayWidget) {
    const desktop = document.querySelector("#desktop");
    const widget = document.querySelector("#widget");
    const menu = document.querySelector("#widget-menu");
    const menuToggle = document.querySelector("#menu-toggle");
    const compactToggle = document.querySelector("#compact-toggle");
    const restoreWidget = document.querySelector("#restore-widget");
    const taskList = document.querySelector("#task-list");
    const emptyState = document.querySelector("#empty-state");
    const positionNote = document.querySelector("#position-note");
    const toast = document.querySelector("#toast");
    let toastTimer = 0;
    let dragState = null;

    const positionLabels = {
      "top-left": "左上角",
      "top-right": "右上角",
      "bottom-left": "左下角",
      "bottom-right": "右下角",
      custom: "自定义位置",
    };

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
    }

    function setPosition(position) {
      widget.style.left = "";
      widget.style.top = "";
      widget.style.right = "";
      widget.style.bottom = "";
      widget.dataset.position = position;
      document.querySelectorAll("[data-place]").forEach((button) => button.classList.toggle("is-active", button.dataset.place === position));
      positionNote.textContent = `置于${positionLabels[position]} · 可拖动到任意位置`;
    }

    function closeMenu() {
      menu.classList.remove("is-open");
      menuToggle.setAttribute("aria-expanded", "false");
    }

    function updateCount() {
      const count = taskList.querySelectorAll(".today-task:not(.is-completing)").length;
      emptyState.classList.toggle("is-visible", count === 0);
      taskList.hidden = count === 0;
    }

    const date = new Date(2026, 7, 16);
    document.querySelector("#today-date").textContent = new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit", weekday: "short" }).format(date).replaceAll("/", "/");

    menuToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = !menu.classList.contains("is-open");
      menu.classList.toggle("is-open", open);
      menuToggle.setAttribute("aria-expanded", String(open));
    });

    document.addEventListener("pointerdown", (event) => {
      if (!event.target.closest("#widget-menu, #menu-toggle")) closeMenu();
    });

    document.querySelectorAll("[data-place]").forEach((button) => {
      button.addEventListener("click", () => {
        setPosition(button.dataset.place);
        closeMenu();
        showToast(`今日窗口已移到${positionLabels[button.dataset.place]}`);
      });
    });

    compactToggle.addEventListener("click", () => {
      const compact = widget.classList.toggle("is-compact");
      compactToggle.title = compact ? "展开" : "收起";
      compactToggle.setAttribute("aria-label", compact ? "展开今日窗口" : "收起今日窗口");
      closeMenu();
    });

    document.querySelector("#always-on-top").addEventListener("change", (event) => {
      widget.classList.toggle("is-unpinned", !event.target.checked);
      showToast(event.target.checked ? "已开启始终置顶" : "已关闭始终置顶");
    });

    document.querySelector("#launch-with-app").addEventListener("change", (event) => {
      showToast(event.target.checked ? "将随应用启动" : "已取消随应用启动");
    });

    document.querySelector("#hide-widget").addEventListener("click", () => {
      closeMenu();
      widget.classList.add("is-hidden");
      restoreWidget.classList.add("is-visible");
    });

    restoreWidget.addEventListener("click", () => {
      widget.classList.remove("is-hidden");
      restoreWidget.classList.remove("is-visible");
      showToast("今日窗口已重新显示");
    });

    document.querySelectorAll("#open-main").forEach((button) => {
      button.addEventListener("click", () => showToast("正式实现时将在主窗口打开今日任务"));
    });

    document.querySelectorAll(".today-task").forEach((row) => {
      row.addEventListener("click", (event) => {
        if (event.target.closest(".task-check")) return;
        showToast(`将在主窗口打开「${row.dataset.title}」`);
      });
      row.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        showToast(`将在主窗口打开「${row.dataset.title}」`);
      });
      row.querySelector(".task-check").addEventListener("click", (event) => {
        event.stopPropagation();
        row.classList.add("is-completing");
        showToast(`已完成「${row.dataset.title}」· 将同步到主窗口`);
        window.setTimeout(() => {
          row.remove();
          updateCount();
        }, 190);
      });
    });

    document.querySelector("#drag-region").addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || event.target.closest("button, [data-no-drag]")) return;
      const widgetRect = widget.getBoundingClientRect();
      const desktopRect = desktop.getBoundingClientRect();
      dragState = {
        offsetX: event.clientX - widgetRect.left,
        offsetY: event.clientY - widgetRect.top,
        maxX: desktopRect.width - widgetRect.width - 8,
        maxY: desktopRect.height - widgetRect.height - 8,
      };
      widget.style.right = "auto";
      widget.style.bottom = "auto";
      widget.style.left = `${widgetRect.left}px`;
      widget.style.top = `${widgetRect.top}px`;
      widget.dataset.position = "custom";
      widget.classList.add("is-dragging");
      event.currentTarget.setPointerCapture?.(event.pointerId);
    });

    window.addEventListener("pointermove", (event) => {
      if (!dragState) return;
      const left = Math.max(8, Math.min(dragState.maxX, event.clientX - dragState.offsetX));
      const top = Math.max(8, Math.min(dragState.maxY, event.clientY - dragState.offsetY));
      widget.style.left = `${left}px`;
      widget.style.top = `${top}px`;
    });

    window.addEventListener("pointerup", () => {
      if (!dragState) return;
      dragState = null;
      widget.classList.remove("is-dragging");
      document.querySelectorAll("[data-place]").forEach((button) => button.classList.remove("is-active"));
      positionNote.textContent = "自定义位置 · 可从菜单重新吸附到屏幕四角";
    });
    }
  </script>
  <script src="./src/today-widget-runtime.js"></script>
</body>
</html>
