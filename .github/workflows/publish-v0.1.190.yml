name: Publish v0.1.190

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.190.yml

concurrency:
  group: publish-v0.1.190
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.190 visual repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify visual repair behavior
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.190"
          node --check app/renderer/src/app.js
          node --test --test-name-pattern='v0.1.190 visual repair|task repository renders priority|task repository priority controls|task repository follows|settings expose one-confirmation' tests/desktop.test.cjs

  build:
    name: Build v0.1.190 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.190-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.190-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.190 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.190 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.190" >/dev/null 2>&1; then
            echo "v0.1.190 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.190 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.190-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.190
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.190
          target_commitish: ${{ github.sha }}
          name: v0.1.190
          body: |
            ## LOOP 界面可读性与任务筛选优化

            - 修复顶部更新按钮图标和显示异常。
            - 提升设置页与顶部导航文字的字号、对比度和清晰度，并继续跟随字体设置缩放。
            - 调整 Today 任务列表的留白与行距，保持纯任务列表结构。
            - 清理任务筛选弹层中的数量提示，统一分组和优先级下拉箭头，移除优先级筛选的双层控件。
            - 任务行保留序号，截止日期显示在前，优先级固定在最右侧。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
