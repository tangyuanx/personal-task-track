name: Publish v0.1.175

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.175.yml

concurrency:
  group: publish-v0.1.175
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.175 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify recurrence and group presentation
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.175"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs tests/work-rhythm-ui.test.cjs
          grep -q 'task-recurrence-trigger > span' app/renderer/src/styles.css
          grep -q 'repository-group-prefix">分组 ·' app/renderer/src/app.js

  build:
    name: Build v0.1.175 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.175-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.175-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.175 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.175 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.175" >/dev/null 2>&1; then
            echo "v0.1.175 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.175 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.175-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.175
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.175
          target_commitish: ${{ github.sha }}
          name: v0.1.175
          body: |
            ## 任务元数据与分组文案精简

            - 移除循环设置文字继承的胶囊背景，使图标、状态与相邻元数据保持同一背景层。
            - 默认、悬停、聚焦和展开状态继续保持透明，不影响循环设置弹层。
            - 将任务仓库中的“任务分组”精简为“分组”，并统一相关辅助说明。
            - 保留循环逻辑、分组筛选、任务数据和全部原有交互。
            - 更新前端资源缓存键，确保升级后加载本版界面。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
