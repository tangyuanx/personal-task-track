name: Publish v0.1.205

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.205.yml

concurrency:
  group: publish-v0.1.205
  cancel-in-progress: false

jobs:
  # This workflow is the release record for v0.1.205: it runs on demand, and on
  # any push to main that touches this file. The Windows runner checks the tree
  # out with CRLF, so every multi-line assertion in tests/ matches on \r?\n.
  verify:
    name: Verify v0.1.205 notification permission probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify version, syntax, frozen layers and the reminder contract
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.205"
          for f in app/renderer/src/*.js; do node --check "$f"; done
          for f in app/main/*.cjs; do node --check "$f"; done
          # Every frozen layer stays byte-identical to its baseline.
          diff app/renderer/src/widget12.css prototypes/baseline/loop-plane-phase17-frozen/loop-widget-phase12-refinement.css
          diff app/renderer/src/widget13.css prototypes/baseline/loop-plane-phase17-frozen/loop-widget-phase13.css
          diff app/renderer/src/shell-refinement.css prototypes/baseline/loop-plane-phase17-frozen/loop-shell-refinement.css
          diff app/renderer/src/settings.css prototypes/baseline/loop-plane-phase17-frozen/loop-settings-phase9.css
          diff app/renderer/src/refinement.css prototypes/baseline/loop-plane-phase17-frozen/loop-refinement.css
          diff app/renderer/src/time.css prototypes/baseline/loop-plane-phase18-frozen/loop-time-phase18.css
          diff app/renderer/src/desktop.css prototypes/baseline/loop-plane-phase19-frozen/loop-desktop-phase19.css
          # the reminder model and the permission probe keep their own homes
          node -e "const m=require('./app/main/deadline-reminders.cjs'); for (const k of ['deadlineReminderGroups','deadlineReminderKey','reconcileDeadlineReminderState','reminderCopy']) if (typeof m[k] !== 'function') throw new Error('missing '+k)"
          node -e "const c=require('./app/main/notification-capability.cjs'); for (const k of ['detectNotificationCapability','parseWindowsToastSetting','parseMacNotificationFlags','createNotificationCapabilityReader']) if (typeof c[k] !== 'function') throw new Error('missing '+k)"
          # a reminder must never be marked as notified while the system holds them
          grep -q 'permission.state === "blocked"' app/main/deadline-reminders.cjs
          # the panels that silently had no submit handler stay fixed
          ! grep -rn "surface?\.querySelector(\"#[a-z-]*form\")" app/renderer/src/actions.js
          node --test tests/desktop.test.cjs tests/deadline-reminders.test.cjs tests/notification-capability.test.cjs tests/work-rhythm-ui.test.cjs tests/work-navigation-model.test.cjs

  build:
    name: Build v0.1.205 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.205-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.205-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.205 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.205 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.205" >/dev/null 2>&1; then
            echo "v0.1.205 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.205 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.205-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.205
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.205
          target_commitish: ${{ github.sha }}
          name: v0.1.205
          body: |
            ## 桌面提醒：读取真实的系统通知权限

            Electron 不提供通知权限 API（`systemPreferences.getMediaAccessStatus` 只覆盖麦克风/摄像头/屏幕），
            所以这次由应用自己去读各平台真正公开的设置，并把"系统通知关闭"变成**有依据的状态**而不是猜测。

            - **Windows**：读取 WinRT `ToastNotificationManager.CreateToastNotifier(appId).Setting`，
              `Enabled` 视为可用；`DisabledForApplication / DisabledForUser / DisabledByGroupPolicy /
              DisabledByManifest` 视为已关闭（枚举值原样保留）。经 PowerShell 调用 WinRT，不引入原生依赖。
            - **macOS**：读取 `~/Library/Preferences/com.apple.ncprefs.plist`。该 plist 含 data 值，
              `plutil -convert json` 会失败，因此改读 `defaults export` 的 XML，并用无依赖的深度感知扫描器解析。
              无记录 → 未注册（不冤判）；记录 `flags === 0`（所有通知样式均关闭）→ 已关闭；其余 → 可用。
            - **只报能证明的**：读不到的来源一律为"未注册/未知"，界面不会声称系统静音了通知。
            - 系统通知被判定关闭时，提醒**保持待发且不写"已提醒"**，界面显示 demo 的原文
              「系统通知关闭 / 截止安排与处理记录保留，可在系统设置中检查 Loop 的通知权限。」，
              并在「检查设置」里显示读取来源与原始值（如「读取自 macOS 通知记录：已关闭 · flags=0」）以便诊断。
            - 手动「检查提醒 / 重试提醒」会强制重新探测，因此用户在系统设置里改完权限后无需重启应用。

            验证：`node --test` 全绿（231 项，Windows CRLF 检出下 205 项），其中新增 5 项平台探测用例
            （macOS 允许/静音/未注册/不可解析/JSON 兜底、Windows 四种禁用枚举、探测失败与缓存）与
            1 项 blocked 路径用例（不投递、不标记，恢复后可投递）；真实应用行为检查 24（桌面提醒，
            含能力自洽与 blocked 界面）+ 52 + 36 + 62 全部通过。

            已知边界（如实说明）：macOS 只解释"全部关闭"这一无歧义情形，不解释单一样式位；
            专注模式无公开 API，任何平台都读不到；Windows 分支已实现并有单测，但尚未在 Windows 实机跑过。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
