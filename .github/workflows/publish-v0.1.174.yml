name: Publish v0.1.174

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.174.yml

concurrency:
  group: publish-v0.1.174
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.174 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workbench base styles
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.174"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs tests/work-rhythm-ui.test.cjs
          grep -q 'v0.1.174: recurrence is editorial metadata' app/renderer/src/styles.css
          grep -q 'justify-content: flex-start' app/renderer/src/styles.css
          grep -q 'text-align: left' app/renderer/src/styles.css

  build:
    name: Build v0.1.174 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.174-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.174-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.174 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.174 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.174" >/dev/null 2>&1; then
            echo "v0.1.174 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.174 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.174-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.174
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.174
          target_commitish: ${{ github.sha }}
          name: v0.1.174
          body: |
            ## 工作台基础样式修复

            - 循环设置从共用按钮样式中拆出，不再显示胶囊背景或轮廓。
            - 默认、悬停、聚焦和展开状态均保持透明。
            - 循环父容器和历史伪元素不再产生背景、边框或阴影。
            - 背景、进展、结论标题显式左对齐，不再依赖旧样式继承。
            - 保留统一编辑画布、三栏比例、自动保存和全部原有功能。
            - 更新前端资源缓存键，确保升级后加载本版样式。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
