name: Publish v0.1.198

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.198.yml

concurrency:
  group: publish-v0.1.198
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.198 typography clarity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify typography clarity and release alignment
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.198"
          node --check app/renderer/src/app.js
          node --test --test-name-pattern='typography clarity pass|approved 4174 shell|release version, scripts and cache keys are aligned' tests/desktop.test.cjs tests/work-rhythm-ui.test.cjs

  build:
    name: Build v0.1.198 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.198-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.198-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.198 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.198 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.198" >/dev/null 2>&1; then
            echo "v0.1.198 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.198 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.198-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.198
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.198
          target_commitish: ${{ github.sha }}
          name: v0.1.198
          body: |
            ## 字体清晰度优化

            - 统一主界面字体来源，消除不同区域字体渲染不一致。
            - 恢复平台原生字体抗锯齿策略，改善文字笔画发虚的问题。
            - 提升浅色与深色主题中正文、辅助文字和元信息的对比度。
            - 提高筛选、截止日期、任务属性和正文等小字号文字的可读性。
            - 保留现有界面布局、字号档位和已完成任务的弱化层级。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
