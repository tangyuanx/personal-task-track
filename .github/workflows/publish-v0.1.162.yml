name: Publish v0.1.162

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.162.yml

concurrency:
  group: publish-v0.1.162
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.162 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact version and safe integration boundary
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.162"
          test -f app/renderer/src/work-rhythm-refine.js
          test -f app/renderer/src/work-rhythm-refine.css
          grep -q 'work-rhythm-refine.js?v=0.1.162' app/renderer/index.html
          grep -q 'work-rhythm-refine.css?v=0.1.162' app/renderer/index.html
          if grep -q 'require("node:crypto")' app/main/preload.cjs; then
            echo "Sandboxed preload must not require node:crypto"
            exit 1
          fi

  build:
    name: Build v0.1.162 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.162-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.162-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.162 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.162 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.162" >/dev/null 2>&1; then
            echo "v0.1.162 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.162 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.162-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.162
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.162
          target_commitish: ${{ github.sha }}
          name: v0.1.162
          body: |
            ## Work Rhythm 交互精简

            - 将顶部 Work Rhythm 展开层收敛为轻量执行面板，仅保留当前阶段、剩余时间、当前只做什么、下一节点与阶段记录。
            - 右上角仅保留两个协调的图标入口：钟表进入“今日时间轴”，齿轮进入 Work Rhythm 设置；齿轮图标视觉尺寸增大但按钮尺寸保持不变。
            - “今日时间轴”从设置中独立出来，改为一行一个阶段：左侧计划时间，中间阶段与目标，右侧实际执行状态。
            - 时间轴根据执行痕迹与阶段记录展示已完成、进行中、超时、偏离计划、无结果和尚未开始等状态。
            - 保留节奏方案、固定模板、交接导出和阶段记录等既有能力，并将低频内容收进 Work Rhythm 设置。
            - 修正默认工作日完整时间段，包括 16:15–17:15 交付验证、17:15–17:35 缓冲、17:35–17:55 代码与知识沉淀。
            - 本版本仅调整 Work Rhythm renderer 展示层，不修改数据存储、preload、Today Widget 或安装器逻辑。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
