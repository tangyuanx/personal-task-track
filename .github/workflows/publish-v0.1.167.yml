name: Publish v0.1.167

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.167.yml

concurrency:
  group: publish-v0.1.167
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.167 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release source and J1 workbench redesign
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.167"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs
          grep -q 'v0.1.167 - J1 workbench header' app/renderer/src/styles.css
          grep -q 'grid-template-columns: minmax(0, 3fr) minmax(0, 4fr) minmax(0, 3fr)' app/renderer/src/styles.css
          grep -q 'task-context-divider' app/renderer/src/app.js
          grep -q 'renderTaskGroupSelect(task)' app/renderer/src/app.js
          ! grep -q 'brief-progress-ring' app/renderer/src/app.js

  build:
    name: Build v0.1.167 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.167-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.167-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.167 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.167 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.167" >/dev/null 2>&1; then
            echo "v0.1.167 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.167 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.167-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.167
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.167
          target_commitish: ${{ github.sha }}
          name: v0.1.167
          body: |
            ## 工作台上部 J1 精确紧凑设计

            - 标题调整为更清晰的 28px 主层级，并以克制的编辑下划线反馈保持视觉稳定。
            - 完整保留任务标签、优先级、状态、节点进度、截止时间、循环设置和任务分组，按固定长度优先、分组最后重新排序。
            - 仅 Today 保留浅色标签底，优先级、状态和节点进度改为轻量文本；截止时间、循环设置和分组只在交互时显示弱背景。
            - 背景、进展、结论以 30% / 40% / 30% 横向连续展示，三项始终直观可见。
            - 三栏使用均衡高度和仅竖向分隔，移除卡片边框、图标与重复进度；编辑时只让当前栏标题变绿。
            - 同步优化窄屏布局、深色模式与减少透明度场景。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
