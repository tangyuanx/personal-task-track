name: Publish v0.1.172

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.172.yml

concurrency:
  group: publish-v0.1.172
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.172 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify collision-proof repository toolbar
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.172"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs
          grep -q 'gooey-search-field-icon' app/renderer/src/app.js
          grep -q 'v0.1.172 final cascade' app/renderer/src/styles.css
          grep -q 'grid-template-columns:minmax(0,1fr) max-content var(--repository-search-track) 1px 60px' app/renderer/src/styles.css
          grep -q 'gooey-search.is-open .gooey-search-trigger' app/renderer/src/styles.css

  build:
    name: Build v0.1.172 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.172-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.172-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.172 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.172 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.172" >/dev/null 2>&1; then
            echo "v0.1.172 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.172 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.172-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.172
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.172
          target_commitish: ${{ github.sha }}
          name: v0.1.172
          body: |
            ## 任务仓库顶部布局与对齐修复

            - 顶部主行改为抗碰撞 Grid，长分组名称只会省略，不再覆盖搜索入口。
            - 搜索与新增使用相同的 32px 高度、图标尺寸、字号和文字基线。
            - 搜索关闭时始终完整显示“搜索”，不再执行文字压缩动画。
            - 搜索展开时整体原位替换为输入框，新增入口仍固定在最右侧。
            - 窄侧栏、最大字号、长分组名称以及深色模式均保持稳定。
            - 分组管理、筛选、任务/速记切换和任务行等现有功能保持不变。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
