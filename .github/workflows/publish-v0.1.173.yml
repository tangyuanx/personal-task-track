name: Publish v0.1.173

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.173.yml

concurrency:
  group: publish-v0.1.173
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.173 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shared task brief canvas
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.173"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs
          grep -q 'v0.1.173 final cascade' app/renderer/src/styles.css
          grep -q 'one shared writing canvas for the task brief' app/renderer/src/styles.css
          grep -q 'task-recurrence-trigger\[aria-expanded="true"\]' app/renderer/src/styles.css

  build:
    name: Build v0.1.173 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.173-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.173-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.173 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.173 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.173" >/dev/null 2>&1; then
            echo "v0.1.173 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.173 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.173-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.173
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.173
          target_commitish: ${{ github.sha }}
          name: v0.1.173
          body: |
            ## 工作台统一编辑画布

            - 背景、进展、结论共用一块连续的编辑画布。
            - 编辑画布只保留整体上下边界和栏间竖向分隔。
            - 每个输入区不再显示独立边框、圆角、底线或编辑图标。
            - 三栏标题保持左对齐，当前编辑栏仅显示极浅聚焦反馈。
            - 循环设置在默认、悬停和展开状态下均保持透明。
            - 原有任务数据、自动保存、循环设置和三栏比例保持不变。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
