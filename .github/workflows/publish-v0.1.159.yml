name: Publish v0.1.159

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.159.yml

concurrency:
  group: publish-v0.1.159
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.159 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.159"

  build:
    name: Build v0.1.159 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.159-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.159-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.159 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.159 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.159" >/dev/null 2>&1; then
            echo "v0.1.159 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.159 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.159-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.159
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.159
          target_commitish: ${{ github.sha }}
          name: v0.1.159
          body: |
            ## 更新内容

            - 截至时间提醒支持按任务配置提前量。
            - 默认在截至时间前 1 小时发送系统通知。
            - 支持不提醒、截至时、提前 5/15/30 分钟、1/2 小时、1/2 天和 1 周。
            - 提醒状态升级并兼容旧版本记录，避免应用升级后重复通知。
            - 点击单任务通知可直接打开对应任务，合并通知可进入日历查看。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
