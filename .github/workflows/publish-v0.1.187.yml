name: Publish v0.1.187

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.187.yml

concurrency:
  group: publish-v0.1.187
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.187 task repository priority states
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify repository priority behavior
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.187"
          node --check app/renderer/src/app.js
          node --check tests/work-rhythm-ui.test.cjs
          node --test --test-name-pattern='task repository priority controls|release version, scripts and cache keys are aligned' tests/desktop.test.cjs tests/work-rhythm-ui.test.cjs

  build:
    name: Build v0.1.187 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.187-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.187-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.187 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.187 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.187" >/dev/null 2>&1; then
            echo "v0.1.187 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.187 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.187-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.187
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.187
          target_commitish: ${{ github.sha }}
          name: v0.1.187
          body: |
            ## 任务仓库优先级体验优化

            - 将任务行优先级控件扩大为更易点击的浅色胶囊，同时保持低干扰视觉。
            - 优先级文案仅显示“高 / 中 / 低”，不再附加“优先”两字。
            - 已完成任务移除优先级色，完成按钮也同步降权，避免在列表中抢占注意力。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
