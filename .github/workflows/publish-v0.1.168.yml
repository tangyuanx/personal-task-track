name: Publish v0.1.168

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.168.yml

concurrency:
  group: publish-v0.1.168
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.168 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify compact Today-aligned task brief
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.168"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs
          grep -q 'v0.1.168 - J1 workbench header' app/renderer/src/styles.css
          grep -q 'grid-template-columns: minmax(0, 3fr) minmax(0, 4fr) minmax(0, 3fr)' app/renderer/src/styles.css
          grep -q 'min-height: 132px' app/renderer/src/styles.css
          grep -q 'height: 79px' app/renderer/src/styles.css

  build:
    name: Build v0.1.168 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.168-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.168-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.168 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.168 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.168" >/dev/null 2>&1; then
            echo "v0.1.168 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.168 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.168-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.168
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.168
          target_commitish: ${{ github.sha }}
          name: v0.1.168
          body: |
            ## 工作台三栏高度优化

            - 将背景、进展、结论三栏总高度由 206px 收紧为 132px，恢复与左侧今日任务底边对齐的紧凑布局。
            - 正文编辑区调整为 79px，保留多行直接查看；内容较多时可在各栏内独立滚动。
            - 完整保留 30% / 40% / 30% 栏宽、竖向分隔线、无卡片外框、现有字体层级和聚焦反馈。
            - 左侧今日任务固定高度及其他工作台结构保持不变。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
