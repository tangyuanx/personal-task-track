name: Publish v0.1.211

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.211.yml

concurrency:
  group: publish-v0.1.211
  cancel-in-progress: false

jobs:
  # This workflow is the release record for v0.1.211: it runs on demand, and on
  # any push to main that touches this file.
  verify:
    name: Verify v0.1.211 integrated title bar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify version, syntax and the frozen layer set
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.211"
          for f in app/renderer/src/*.js; do node --check "$f"; done
          for f in app/main/*.cjs; do node --check "$f"; done
          # Every frozen layer stays byte-identical to its baseline.
          diff app/renderer/src/widget12.css prototypes/baseline/loop-plane-phase17-frozen/loop-widget-phase12-refinement.css
          diff app/renderer/src/widget13.css prototypes/baseline/loop-plane-phase17-frozen/loop-widget-phase13.css
          diff app/renderer/src/shell-refinement.css prototypes/baseline/loop-plane-phase17-frozen/loop-shell-refinement.css
          diff app/renderer/src/settings.css prototypes/baseline/loop-plane-phase17-frozen/loop-settings-phase9.css
          diff app/renderer/src/refinement.css prototypes/baseline/loop-plane-phase17-frozen/loop-refinement.css
          diff app/renderer/src/time.css prototypes/baseline/loop-plane-phase18-frozen/loop-time-phase18.css
          diff app/renderer/src/desktop.css prototypes/baseline/loop-plane-phase19-frozen/loop-desktop-phase19.css
          diff app/renderer/src/scale.css prototypes/baseline/loop-plane-phase20-frozen/loop-scale-phase20.css
          diff app/renderer/src/brief21.css prototypes/baseline/loop-plane-phase21-frozen/loop-brief-phase21.css
          diff app/renderer/src/controls22.css prototypes/baseline/loop-plane-phase22-frozen/loop-controls-phase22.css
          diff app/renderer/src/notebook23.css prototypes/baseline/loop-plane-phase23-frozen/loop-notebook-phase23.css
          diff app/renderer/src/management24.css prototypes/baseline/loop-plane-phase24-frozen/loop-management-phase24.css
          diff app/renderer/src/window25.css prototypes/baseline/loop-plane-phase25-frozen/loop-window-phase25.css
      - name: Verify the phase25 integrated title bar contract
        shell: bash
        run: |
          # One 48px row owns the window controls. The layer is gated, loads after
          # the layers it sits on and before work.js, with bridge.css still last.
          grep -q 'data-window25-enabled' app/renderer/index.html
          node -e "const h=require('fs').readFileSync('app/renderer/index.html','utf8');const m=h.indexOf('src/management24.js'),w=h.indexOf('src/window25.js'),k=h.indexOf('src/work.js');if(!(m>=0&&w>m))throw new Error('window25.js must load after management24.js');if(!(k>=0&&w<k))throw new Error('window25.js must load before work.js');const c=h.indexOf('src/window25.css'),b=h.indexOf('src/bridge.css');if(!(c>=0&&b>c))throw new Error('window25.css must load before bridge.css')"
          # The platform's own controls are kept: only the title strip is hidden,
          # the macOS lights are positioned and the Windows/Linux overlay is set.
          grep -q 'titleBarStyle: "hidden"' app/main/main.cjs
          grep -q 'trafficLightPosition' app/main/main.cjs
          grep -q 'titleBarOverlay' app/main/main.cjs
          grep -q 'const MAC_TRAFFIC_LIGHT_POSITION = { x: 9, y: 17 };' app/main/main.cjs
          # The bridge reports real window state and paints the overlay; it exposes
          # no window action, so no second set of controls can exist.
          grep -q 'windowControls: {' app/main/preload.cjs
          grep -q 'window-controls:get-state' app/main/preload.cjs
          grep -q 'window-controls:set-chrome-colors' app/main/main.cjs
          grep -q 'win === mainWindow' app/main/main.cjs
          ! grep -qE 'window-controls:(minimize|maximize|close)' app/main/preload.cjs
          # No Demo simulation survives, and no HTML copy of a native control.
          ! grep -qE 'data-desk19-window|window25-platform|window25-review' app/renderer/src/window25.js
          ! grep -q 'window25-traffic"' app/renderer/src/window25.js
          ! grep -q 'window25-caption"' app/renderer/src/window25.js
          # The reserved native area is derived from the platform geometry.
          grep -q 'getTitlebarAreaRect' app/renderer/src/window25.js
          grep -qF 'window.innerWidth - (rect.x + rect.width)' app/renderer/src/window25.js
          # The override layer keeps the moved update chip attached to its dot and
          # the collapsed rail at the Demo's 64px.
          grep -q 'window25-native-caption' app/renderer/src/bridge.css
          grep -q 'window25-native-traffic' app/renderer/src/bridge.css
          grep -q 'position: relative' app/renderer/src/bridge.css
          grep -q '.app.nav-collapsed { --nav-width: 64px !important; }' app/renderer/src/bridge.css
          # The frozen Demo baseline for this phase is present and complete.
          test -f prototypes/baseline/loop-plane-phase25-frozen/MANIFEST.sha256
          test -f prototypes/baseline/loop-plane-phase25-frozen/DEPENDENCIES.sha256
          test -f prototypes/baseline/loop-plane-phase25-frozen/README.md
          test -f prototypes/baseline/loop-plane-phase25-frozen/loop-plane-phase25-candidate.html
          test -f prototypes/baseline/loop-plane-phase25-frozen/loop-window-phase25.js
          grep -q 'loop-window-phase25.css' prototypes/baseline/loop-plane-phase25-frozen/MANIFEST.sha256
      - name: Run the desktop and contract suites
        run: npm run check

  build:
    name: Build v0.1.211 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.211-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.211-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.211 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.211 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The tag push runs the "Release Desktop Apps" workflow, which creates the
      # tag and the GitHub Release for this same version and commit. This record
      # job therefore never competes with it: if a v0.1.211 release already
      # exists it verifies that, reports it, and stops; otherwise it publishes.
      - name: Detect an existing v0.1.211 release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.211" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$tag_sha" ]; then
            commit_sha="$(gh api "repos/${{ github.repository }}/git/tags/$tag_sha" --jq '.object.sha' 2>/dev/null || echo "$tag_sha")"
            echo "tag v0.1.211 -> $commit_sha"
            echo "tag_commit=$commit_sha" >> "$GITHUB_OUTPUT"
          else
            echo "tag v0.1.211 does not exist yet"
            echo "tag_commit=" >> "$GITHUB_OUTPUT"
          fi
          if gh release view v0.1.211 >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report an already published release and stop
        if: steps.existing.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "v0.1.211 is already published (tag -> ${{ steps.existing.outputs.tag_commit }})."
          echo "The tag-triggered Release workflow produced the installers for this"
          echo "version and commit, so this record job has nothing left to publish."
          gh release view v0.1.211 --json tagName,name,isDraft,isPrerelease,publishedAt,assets \
            --jq '"release \(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease) at \(.publishedAt) assets=\(.assets|length)"'
      - name: Collect v0.1.211 release assets
        if: steps.existing.outputs.release_exists != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.211-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        if: steps.existing.outputs.release_exists != 'true'
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.211
        if: steps.existing.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.211
          target_commitish: ${{ github.sha }}
          name: v0.1.211
          body_path: docs/release-notes/v0.1.211.md
