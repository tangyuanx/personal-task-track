name: Publish v0.1.163

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.163.yml

concurrency:
  group: publish-v0.1.163
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.163 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release source and focused navigation
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.163"
          node --check app/renderer/src/work-rhythm-refine.js
          ! grep -q "wr2-summary\|wr2-timeline-backdrop\|打开主任务" app/renderer/src/work-rhythm-refine.js

  build:
    name: Build v0.1.163 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.163-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.163-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.163 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.163 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.163" >/dev/null 2>&1; then
            echo "v0.1.163 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.163 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.163-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.163
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.163
          target_commitish: ${{ github.sha }}
          name: v0.1.163
          body: |
            ## 工作节奏导航重设计

            - 当前阶段只突出当前任务，剩余时间与下一阶段统一收束到底部。
            - 时钟入口打开 C1 分段式今日时间轴，只保留时间与阶段名称。
            - 设置入口采用 S2 分组层级，集中时间方案、固定模板与访问保护。
            - 保留现有本地数据、时间方案、恢复卡与访问密码兼容性。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
