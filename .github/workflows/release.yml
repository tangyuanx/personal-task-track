name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Release ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: release-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: release-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage platform release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect platform release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      # One source of truth for the notes: docs/release-notes/<tag>.md when the
      # version has hand-written notes, otherwise the generated changelog.
      - name: Resolve the release notes
        id: notes
        shell: bash
        run: |
          file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "body_path=$file" >> "$GITHUB_OUTPUT"
            echo "using hand-written notes from $file"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "no $file; the release will use the generated changelog"
          fi

      - name: Upload complete release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      # action-gh-release uploads assets for an existing release but does not
      # rewrite its body, so a re-run (a re-pointed tag, a retried release)
      # would keep the stale notes. Set them explicitly.
      - name: Keep the release notes in sync
        if: steps.notes.outputs.body_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.body_path }}"
