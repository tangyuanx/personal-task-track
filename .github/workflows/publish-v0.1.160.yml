name: Publish v0.1.160

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.160.yml

concurrency:
  group: publish-v0.1.160
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.160 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.160"

  build:
    name: Build v0.1.160 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.160-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.160-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.160 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.160 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.160" >/dev/null 2>&1; then
            echo "v0.1.160 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.160 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.160-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.160
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.160
          target_commitish: ${{ github.sha }}
          name: v0.1.160
          body: |
            ## 更新内容

            - 新增受保护的 Work Rhythm 工作节奏功能，默认关闭，不影响普通 LOOP 用户。
            - 在设置中输入访问密码后可开启；关闭后主界面完全隐藏该功能。
            - 顶部采用低干扰静默导航，仅显示当前阶段与剩余时间。
            - 支持当前阶段、完整每日时间轴、固定记录模板与阶段结构化记录。
            - 支持默认工作日、Debug 日、学习日，并可创建、复制、编辑和切换自定义节奏方案。
            - 每个时间段可配置开始/结束时间、阶段名称、当前只做什么及绑定模板。
            - 新增本地交接导出，可复制或导出 Markdown 给 ChatGPT；LOOP 本地不做自动分析。
            - 弹层、阶段记录和方案抽屉支持点击外部或 Esc 关闭。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
