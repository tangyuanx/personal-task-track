name: Publish v0.1.177

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.177.yml

concurrency:
  group: publish-v0.1.177
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.177 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify work and growth navigation
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.177"
          node --check app/renderer/src/work-navigation-model.js
          node --check app/renderer/src/work-rhythm.js
          node --test tests/work-navigation-model.test.cjs tests/work-rhythm-ui.test.cjs
          grep -q '今日任务不设数量上限' app/renderer/src/work-rhythm.js
          grep -q '个人成长' app/renderer/src/work-navigation-model.js

  build:
    name: Build v0.1.177 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.177-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.177-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.177 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.177 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.177" >/dev/null 2>&1; then
            echo "v0.1.177 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.177 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.177-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.177
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.177
          target_commitish: ${{ github.sha }}
          name: v0.1.177
          body: |
            ## 工作与个人成长导航

            - 导航只显示当前阶段、当前任务与下一动作，不再重复呈现工作或学习队列。
            - Today 任务数量不设上限；可随时切换已有今日任务，或从全部任务中选择并加入 Today。
            - 工作任务完成后重新计算 Today 并自动顺移；学习任务按个人成长分组顺序自动接续。
            - 未完成学习任务通过恢复卡保留进度，次日继续同一任务。
            - 工作日采用今日启动、上午工作、下午工作、个人成长、今日收束五个宽阶段，并支持快速手动切换。
            - 支持配置学习来源、周末四小时成长时间及可选开始时间。
            - 支持 JSON v1 学习计划校验、预览和幂等导入，并附 RDMA 示例计划。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
