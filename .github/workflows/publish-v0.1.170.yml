name: Publish v0.1.170

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.170.yml

concurrency:
  group: publish-v0.1.170
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.170 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify global font scale presets
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.170"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs
          grep -q 'task-track-font-scale' app/renderer/src/app.js
          grep -q 'data-font-scale="largest"' app/renderer/src/styles.css
          grep -q 'font-size:calc(13 \* var(--font-unit))' app/renderer/src/styles.css

  build:
    name: Build v0.1.170 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.170-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.170-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.170 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.170 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.170" >/dev/null 2>&1; then
            echo "v0.1.170 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.170 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.170-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.170
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.170
          target_commitish: ${{ github.sha }}
          name: v0.1.170
          body: |
            ## 全局字号档位

            - 在设置的“外观”页面新增“界面字号”，支持当前、较大、大、特大四档整体切换。
            - 当前档完整保留 v0.1.169 的字号，另外三档依次放大 6%、12% 和 18%。
            - 新安装与旧版本升级默认使用“大（推荐）”，也可随时切回当前最小字号。
            - 所有档位仅调整字号、对应行高和必要的横向空间，不改变当前布局结构或功能。
            - 主界面、任务仓库、工作台、设置、弹窗、知识编辑器与工作节奏界面使用同一字号档位。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
