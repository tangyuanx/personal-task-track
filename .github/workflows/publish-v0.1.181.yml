name: Publish v0.1.181

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.181.yml

concurrency:
  group: publish-v0.1.181
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.181 source and flow drag behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify processing-flow drag behavior
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.181"
          node --check app/renderer/src/app.js
          node --test --test-name-pattern='processing-flow nodes move across parents' tests/desktop.test.cjs

  build:
    name: Build v0.1.181 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.181-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.181-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.181 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.181 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.181" >/dev/null 2>&1; then
            echo "v0.1.181 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.181 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.181-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.181
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.181
          target_commitish: ${{ github.sha }}
          name: v0.1.181
          body: |
            ## 处理流拖拽体验改进

            - 处理流节点支持按住整行空白区域直接拖动，不再要求点击最右侧按钮。
            - 拖动时实时显示目标节点、落点关系和最终层级。
            - 节点上下区域用于同级排序，中间区域才会改变父子层级，减少误操作。
            - 支持跨父节点移动、移回顶层，并阻止移动到自身或自己的子节点。
            - 使用 Pointer Events 改善文件预览及桌面环境中的拖动稳定性，并保留边缘自动滚动。
            - 本次不修改任务数据或存储结构。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
