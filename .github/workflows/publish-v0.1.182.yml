name: Publish v0.1.182

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.182.yml

concurrency:
  group: publish-v0.1.182
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.182 long-press flow drag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify long-press flow drag behavior
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.182"
          node --check app/renderer/src/app.js
          node --test --test-name-pattern='processing-flow nodes move across parents' tests/desktop.test.cjs

  build:
    name: Build v0.1.182 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.182-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.182-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.182 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.182 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.182" >/dev/null 2>&1; then
            echo "v0.1.182 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.182 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.182-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.182
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.182
          target_commitish: ${{ github.sha }}
          name: v0.1.182
          body: |
            ## 处理流长按拖拽调整

            - 删除处理流节点前方的拖拽图标，不再占用节点内容空间。
            - 节点整行支持长按后直接拖拽，标题区域同样可作为长按入口。
            - 短按继续执行原有编辑或选择操作，不会误触发拖拽。
            - 长按准备阶段提供轻微即时反馈；提前移动超过容差会取消拖拽识别。
            - 保留同级排序、父子层级调整、跨父节点移动、顶层移动及落点层级提示。
            - 本次不修改任务数据或存储结构。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
