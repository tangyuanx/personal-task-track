name: Publish v0.1.207

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.207.yml

concurrency:
  group: publish-v0.1.207
  cancel-in-progress: false

jobs:
  # This workflow is the release record for v0.1.207: it runs on demand, and on
  # any push to main that touches this file. The Windows runner checks the tree
  # out with CRLF, so every multi-line assertion in tests/ matches on \r?\n.
  verify:
    name: Verify v0.1.207 task-brief direct input
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify version, syntax, frozen layers and the reminder contract
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.207"
          for f in app/renderer/src/*.js; do node --check "$f"; done
          for f in app/main/*.cjs; do node --check "$f"; done
          # Every frozen layer stays byte-identical to its baseline.
          diff app/renderer/src/widget12.css prototypes/baseline/loop-plane-phase17-frozen/loop-widget-phase12-refinement.css
          diff app/renderer/src/widget13.css prototypes/baseline/loop-plane-phase17-frozen/loop-widget-phase13.css
          diff app/renderer/src/shell-refinement.css prototypes/baseline/loop-plane-phase17-frozen/loop-shell-refinement.css
          diff app/renderer/src/settings.css prototypes/baseline/loop-plane-phase17-frozen/loop-settings-phase9.css
          diff app/renderer/src/refinement.css prototypes/baseline/loop-plane-phase17-frozen/loop-refinement.css
          diff app/renderer/src/time.css prototypes/baseline/loop-plane-phase18-frozen/loop-time-phase18.css
          diff app/renderer/src/desktop.css prototypes/baseline/loop-plane-phase19-frozen/loop-desktop-phase19.css
          diff app/renderer/src/scale.css prototypes/baseline/loop-plane-phase20-frozen/loop-scale-phase20.css
          diff app/renderer/src/brief21.css prototypes/baseline/loop-plane-phase21-frozen/loop-brief-phase21.css
          # phase21 is gated by a body attribute and the script loads after the
          # layers it overrides (renderShellBrief, render, beginEdit entries)
          grep -q 'data-brief21-enabled' app/renderer/index.html
          node -e "const h=require('fs').readFileSync('app/renderer/index.html','utf8');const a=h.indexOf('src/app.js'),b=h.indexOf('src/brief21.js');if(!(a>=0&&b>a))throw new Error('brief21.js must load after app.js')"
          grep -q 'renderShellBrief = function brief21Brief' app/renderer/src/brief21.js
          grep -q 'brief21-flow-toggle' app/renderer/src/brief21.js
          grep -q 'task.history.unshift' app/renderer/src/brief21.js
          grep -q 'function normalizeTaskHistory' app/main/storage.cjs
          # the legacy edit bindings must never take over a phase21 brief input
          ! grep -rnF 'querySelectorAll("[data-edit-key]").forEach' app/renderer/src/app.js
          test "$(grep -cF '[data-edit-key]:not(.brief21-input)' app/renderer/src/app.js)" = "2"

          # phase20 is gated by the body attribute and wraps render(), so scale.js
          # must load after app.js
          grep -q 'data-scale20-enabled' app/renderer/index.html
          node -e "const h=require('fs').readFileSync('app/renderer/index.html','utf8');const a=h.indexOf('src/app.js'),s=h.indexOf('src/scale.js');if(!(a>=0&&s>a))throw new Error('scale.js must load after app.js')"
          grep -q 'render = function scale20Render' app/renderer/src/scale.js
          grep -q 'scale20-table-scroll' app/renderer/src/scale.js
          grep -q 'scale20-brief-toggle' app/renderer/src/scale.js
          grep -q 'scale20-locate' app/renderer/src/scale.js
          # the Demo's responsive ladder and note typography must not be shadowed
          grep -q 'max-width: 1100px' app/renderer/src/bridge.css
          grep -q 'min-width: 1600px' app/renderer/src/bridge.css
          grep -q 'max-width: 840px' app/renderer/src/bridge.css
          grep -q 'line-height: 1.9' app/renderer/src/bridge.css
          # no reviewer bar, scale switcher or synthetic fixture may reach the product
          ! grep -rn 'scale20-scene\|syntheticScale20\|内容规模' app/renderer/src/*.js app/renderer/src/*.css
          # the reminder model and the permission probe keep their own homes
          node -e "const m=require('./app/main/deadline-reminders.cjs'); for (const k of ['deadlineReminderGroups','deadlineReminderKey','reconcileDeadlineReminderState','reminderCopy']) if (typeof m[k] !== 'function') throw new Error('missing '+k)"
          node -e "const c=require('./app/main/notification-capability.cjs'); for (const k of ['detectNotificationCapability','parseWindowsToastSetting','parseMacNotificationFlags','createNotificationCapabilityReader']) if (typeof c[k] !== 'function') throw new Error('missing '+k)"
          # a reminder must never be marked as notified while the system holds them
          grep -q 'permission.state === "blocked"' app/main/deadline-reminders.cjs
          # the panels that silently had no submit handler stay fixed
          ! grep -rn "surface?\.querySelector(\"#[a-z-]*form\")" app/renderer/src/actions.js
          node --test tests/desktop.test.cjs tests/deadline-reminders.test.cjs tests/notification-capability.test.cjs tests/work-rhythm-ui.test.cjs tests/work-navigation-model.test.cjs

  build:
    name: Build v0.1.207 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.207-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.207-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.207 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.207 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.207" >/dev/null 2>&1; then
            echo "v0.1.207 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.207 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.207-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.207
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.207
          target_commitish: ${{ github.sha }}
          name: v0.1.207
          body: |
            ## 任务简报：直接输入，以及一个点击切换的修复

            以冻结的 phase21 基准（`loop-brief-phase21.css/js` + `MANIFEST.sha256`，全程未修改）为唯一标准等效复现。

            - **直接输入**：背景／进展／结论变成带标签的多行输入区，点击文字即可编辑；外层与字段在悬停、
              输入、键盘焦点下都没有边框和底色，只有光标、标签变色，键盘焦点时标签加下划线。
            - **度量与上限**：字段随内容增高至 160px，整块上限 `min(280px,36dvh)` 并自身滚动，不挤占处理流。
            - **真实保存**：输入即时写入真实任务模型并经既有的去抖保存落盘；一次改变的编辑会话合并为一条
              「历史处理」记录（上限 60）。`history` 此前存在于模型与界面、但保存时会被丢弃，本次纳入主进程归一。
            - **键盘**：Enter 换行、Tab 正常切换、Esc 或 ⌘／Ctrl+Enter 保留并退出焦点，组合输入不被提交快捷键打断；
              任务切换与重绘中保留文本、光标、选区与换行。
            - **处理流开关**：一个「任务简报」总开关（宽窗按钮、窄窗抽屉外只读提示），按任务记住本页选择：
              普通流默认展开、节点打开默认收起、补充结论与查看结果自动展开并定位；展开阅读隐藏简报与开关；
              知识笔记保留自己的开关。
            - **修复你反馈的单击切换**：正在编辑背景时单击进展要点两次。真实事件轨迹显示 `mousedown` 与
              `mouseup` 之间发生了一次重绘，DOM 被替换后浏览器不再派发 `click`。根因是产品遗留的两处
              `[data-edit-key]` 通用编辑绑定（`blur → render()`、`change → refreshTaskRepository()`）接管了
              phase21 的输入框；两处绑定均收窄为 `:not(.brief21-input)`。现在事件轨迹为
              `mousedown:进展 → focusout:背景 → focusin:进展 → mouseup → click:进展`，单击即切换且 0 次重绘。

            隔离边界：Demo 的评审栏、内容规模切换、示例时钟与合成数据只存在于 `fixtures/` 与冻结 Demo 中，
            未写入任何正式业务数据（检阅数据目录实测 0 条合成记录）。

            验证：`node --test` 全绿（234 项，Windows CRLF 检出下 208 项），其中新增 phase21 契约与
            「旧编辑绑定不得接管 phase21 输入框」断言；真实应用行为检查 22 项全通过（含真实键盘输入：
            `甲乙`+Enter+`丙丁` → 值为 `甲乙\n丙丁` 且焦点留存；Esc 保留文本并恰好记一条历史；编辑与历史写入磁盘），
            既有探针无回归（phase20 19、ui-fixes 35、phase18 52、phase19 24、functional 62）；
            同条件三图覆盖 1894×1344／1280×720／1024×720 × 浅／深 × 9 状态 = 54 组，非文字区域像素差 0.00%。

            已知边界（如实说明）：`flow`／`brief` 两状态在验收驱动下存在 28px 横向滚动差异（产品在选中变化时
            按 Demo 同规则横向揭示节点，验收为直接置状态、只触发产品侧；两侧滚动宽度实测相同）；
            Windows 实机、真实数据长期持久化回归与无障碍认证未验证。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
