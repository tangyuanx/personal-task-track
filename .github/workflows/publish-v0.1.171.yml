name: Publish v0.1.171

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.171.yml

concurrency:
  group: publish-v0.1.171
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.171 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository toolbar refinement
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.171"
          node --check app/renderer/src/app.js
          node --test tests/desktop.test.cjs
          grep -q 'repository-group-prefix">任务分组 ·' app/renderer/src/app.js
          grep -q '<span>优先级 ·</span>' app/renderer/src/app.js
          grep -q 'repository-action-divider' app/renderer/src/app.js
          grep -q 'v0.1.171 final cascade' app/renderer/src/styles.css

  build:
    name: Build v0.1.171 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.171-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
            artifact: v0.1.171-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and tests
        run: npm run check

      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName

      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release

      - name: Stage v0.1.171 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.171 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.171" >/dev/null 2>&1; then
            echo "v0.1.171 already exists; refusing to replace it."
            exit 1
          fi

      - name: Collect v0.1.171 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.171-*
          path: release
          merge-multiple: true

      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms

      - name: Publish v0.1.171
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.171
          target_commitish: ${{ github.sha }}
          name: v0.1.171
          body: |
            ## 任务仓库顶部视觉统一

            - 任务分组入口改为“任务分组 · 当前分组”的连续文字表达，首次使用时含义更明确。
            - 分组入口与优先级统一字号、字重和颜色，去除分块式加粗层级。
            - 优先级筛选移除背景和外轮廓，与完成状态筛选形成清晰主次。
            - 搜索与新增任务改为等权的“图标 + 短文字”工具，并使用细分隔线区分。
            - 新增任务入口保持固定在右上角，搜索框展开时不会跟随移动。
            - 分组搜索、新建、重命名、删除以及任务/速记筛选等原有功能保持不变。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
