name: Publish v0.1.186

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.186.yml

concurrency:
  group: publish-v0.1.186
  cancel-in-progress: false

jobs:
  verify:
    name: Verify v0.1.186 knowledge table resizing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify table resizing behavior
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.1.186"
          node --check app/renderer/src/app.js
          node --check app/renderer/src/knowledge-document.js
          node --test --test-name-pattern='knowledge table column widths' tests/desktop.test.cjs

  build:
    name: Build v0.1.186 ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
            artifact: v0.1.186-macos
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --x64 --publish never
            artifact: v0.1.186-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and tests
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Verify update metadata
        run: node tools/verify-update-artifacts.cjs release
      - name: Stage v0.1.186 release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish v0.1.186 release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to replace an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v0.1.186" >/dev/null 2>&1; then
            echo "v0.1.186 already exists; refusing to replace it."
            exit 1
          fi
      - name: Collect v0.1.186 release assets
        uses: actions/download-artifact@v4
        with:
          pattern: v0.1.186-*
          path: release
          merge-multiple: true
      - name: Verify complete cross-platform update feed
        run: node tools/verify-update-artifacts.cjs release --require-all-platforms
      - name: Publish v0.1.186
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.186
          target_commitish: ${{ github.sha }}
          name: v0.1.186
          body: |
            ## 知识笔记表格体验优化

            - 采用清晰网格 A 方案，强化外框、表头和单元格边界，让表格更容易辨识。
            - 收紧单元格留白，并在窄窗口中使用横向滚动，避免编辑区域被表格撑开。
            - 支持拖动列分隔线调整相邻列宽，拖动时保持表格总宽度稳定。
            - 双击分隔线或按 Home 恢复默认列宽，键盘方向键也可微调。
            - 每篇知识笔记、每张表格独立保存列宽，重新打开后继续沿用。
            - 列宽作为显示元数据保存，不写入或污染 Markdown 正文。
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
